[data-theme="chrome"] { --bg:#0c0c10; --bg2:#22222c; --card:rgba(24,24,32,.92); --hot:#ff3d7f; --cyan:#d8e1ea; --volt:#ffd700; --orange:#ffb000; --purple:#9aa5b1; --sun1:#fff6c0; --sun2:#ffd700; --sun3:#8a6d00; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh; overflow-x: hidden;
}
/* sunset + retro grid backdrop */
.backdrop { position: fixed; inset: 0; z-index: -2; overflow: hidden;
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 55%, var(--bg) 100%); }
.backdrop .sun { position: absolute; left: 50%; top: 18vh; width: 240px; height: 240px; transform: translateX(-50%); border-radius: 50%;
  background: linear-gradient(180deg, var(--sun1), var(--sun2) 55%, var(--sun3));
  -webkit-mask: repeating-linear-gradient(180deg, #000 0 14px, transparent 14px 18px);
          mask: repeating-linear-gradient(180deg, #000 0 14px, transparent 14px 18px);
  opacity: .35; filter: blur(.3px); }
.backdrop .grid { position: absolute; left: -50%; right: -50%; bottom: -10vh; height: 55vh; transform: perspective(300px) rotateX(62deg); transform-origin: bottom;
  background-image: linear-gradient(var(--hot) 2px, transparent 2px), linear-gradient(90deg, var(--hot) 2px, transparent 2px);
  background-size: 48px 48px; opacity: .28; }
.scanlines { position: fixed; inset: 0; pointer-events: none; z-index: 50;
  background: repeating-linear-gradient(180deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); }

.app { max-width: 480px; margin: 0 auto; padding: 12px 14px calc(96px + env(safe-area-inset-bottom)); }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 2px 10px; }
.logo { font-family: 'NeonTube', 'Arcade', system-ui; font-size: 30px; line-height: 1; letter-spacing: 1px; color: var(--hot);
  text-shadow: 0 0 6px var(--hot), 0 0 18px var(--hot); margin: 0; }
.logo small { display: block; white-space: nowrap; font-family: 'Arcade', monospace; font-size: 7px; letter-spacing: 1px; color: var(--cyan); text-shadow: 0 0 6px var(--cyan); margin-top: 6px; }
.lvl-pill { font-family: 'Arcade', monospace; font-size: 10px; padding: 8px 10px; border: 2px solid var(--volt); color: var(--volt); border-radius: 4px; box-shadow: 0 0 10px var(--volt) inset, 3px 3px 0 var(--hot); white-space: nowrap; background: rgba(0,0,0,.4); }

h2.screen-title { font-family: 'NeonTube', 'Arcade', system-ui; font-weight: 400; font-size: 34px; margin: 4px 0 2px; color: var(--cyan);
  text-shadow: 0 0 8px var(--cyan); letter-spacing: 1px; }
/* triple shoe stripes under titles */
.stripes { height: 12px; margin: 0 0 14px; background: linear-gradient(180deg, var(--hot) 0 3px, transparent 3px 4.5px, var(--orange) 4.5px 7.5px, transparent 7.5px 9px, var(--volt) 9px 12px);
  transform: skewX(-25deg); width: 70%; border-radius: 2px; }

.card { position: relative; background: var(--card); border: 2px solid var(--cyan); border-radius: 10px; padding: 14px; margin: 0 0 14px;
  box-shadow: 5px 5px 0 var(--hot), 0 0 18px rgba(0,229,255,.18); overflow: hidden; }
.card.hot { border-color: var(--hot); box-shadow: 5px 5px 0 var(--cyan), 0 0 18px rgba(255,46,136,.2); }
.card.volt { border-color: var(--volt); box-shadow: 5px 5px 0 var(--purple), 0 0 18px rgba(215,255,31,.15); }
/* Memphis accents */
.card.memphis::before { content: ''; position: absolute; right: -8px; top: -8px; width: 60px; height: 60px; opacity: .55; pointer-events: none;
  background: radial-gradient(circle, var(--volt) 2px, transparent 2.5px) 0 0/10px 10px; transform: rotate(12deg); }
.card.memphis::after { content: ''; position: absolute; left: -10px; bottom: -10px; width: 0; height: 0; border-left: 22px solid transparent; border-right: 22px solid transparent;
  border-bottom: 34px solid var(--orange); opacity: .5; transform: rotate(-20deg); pointer-events: none; }
.card h3 { font-family: 'Arcade', monospace; font-size: 12px; letter-spacing: 1px; margin: 0 0 10px; color: var(--volt); text-shadow: 0 0 6px rgba(215,255,31,.6); line-height: 1.5; }
.card h3 .sub { display:block; font-family: system-ui, sans-serif; font-size: 13px; color: var(--muted); text-shadow:none; letter-spacing: 0; margin-top: 2px; }
.muted { color: var(--muted); font-size: 14px; }
.small { font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.spread { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; padding: 8px 6px; text-align: center; }
.stat b { display: block; font-family: 'Arcade', monospace; font-size: 15px; color: var(--cyan); margin-bottom: 6px; text-shadow: 0 0 6px var(--cyan); }
.stat span { font-size: 12px; color: var(--muted); }
.big-num { font-family: 'Arcade', monospace; font-size: 26px; color: var(--hot); text-shadow: 0 0 10px var(--hot); }

/* arcade buttons */
button, .btn { font: inherit; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 10px 14px; border-radius: 8px; cursor: pointer;
  font-family: 'Arcade', monospace; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #12002b;
  background: linear-gradient(180deg, var(--volt), color-mix(in srgb, var(--volt) 70%, #000)); border: 2px solid #000; box-shadow: 0 5px 0 #000, 0 0 12px rgba(215,255,31,.35); transition: transform .05s; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }
.btn.pink { background: linear-gradient(180deg, var(--hot), color-mix(in srgb, var(--hot) 65%, #000)); color: #fff; box-shadow: 0 5px 0 #000, 0 0 12px rgba(255,46,136,.4); }
.btn.cyan { background: linear-gradient(180deg, var(--cyan), color-mix(in srgb, var(--cyan) 65%, #000)); color: #04121a; }
.btn.ghost { background: rgba(0,0,0,.4); color: var(--cyan); border-color: var(--cyan); box-shadow: 0 4px 0 #000; }
.btn.sm { min-height: 36px; padding: 6px 10px; font-size: 9px; }
.btn.block { width: 100%; }
.icon-btn { min-width: 40px; min-height: 40px; border-radius: 8px; border: 2px solid var(--muted); background: rgba(0,0,0,.4); color: var(--text); font-size: 18px; cursor: pointer; }

input, select { width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 8px; border: 2px solid var(--purple); background: rgba(0,0,0,.5); color: var(--text); font-size: 16px; font-family: inherit; }
input:focus, select:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
.field { margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* progress bars */
.bar { height: 14px; border-radius: 7px; background: rgba(255,255,255,.1); overflow: hidden; border: 1px solid rgba(255,255,255,.2); position: relative; }
.bar > i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--hot) 0 8px, var(--orange) 8px 16px); box-shadow: 0 0 10px var(--hot); }
.bar.cyan > i { background: repeating-linear-gradient(-45deg, var(--cyan) 0 8px, var(--purple) 8px 16px); }
.bar.volt > i { background: repeating-linear-gradient(-45deg, var(--volt) 0 8px, var(--ok) 8px 16px); }
.bar .tick { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #fff; opacity: .7; }

/* bottom nav: cassette deck buttons */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; justify-content: center; background: linear-gradient(180deg, #1b1b22, #08080c);
  border-top: 3px solid var(--hot); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 20px rgba(0,0,0,.6); }
nav.tabs .inner { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; width: 100%; max-width: 480px; }
nav.tabs button { min-height: 54px; border-radius: 6px; border: 1px solid #333; background: linear-gradient(180deg, #2c2c36, #15151b); color: #bbb; cursor: pointer;
  font-family: 'Arcade', monospace; font-size: 7px; letter-spacing: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; box-shadow: 0 3px 0 #000; }
nav.tabs button .ico { font-size: 18px; font-family: system-ui; }
nav.tabs button[aria-selected="true"] { color: #000; background: linear-gradient(180deg, var(--volt), color-mix(in srgb, var(--volt) 60%, #000)); transform: translateY(2px); box-shadow: 0 1px 0 #000, 0 0 12px var(--volt); }

.screen { display: none; }
.screen.active { display: block; animation: vhs .25s ease-out; }
@keyframes vhs { 0% { opacity: 0; transform: translateX(-6px) skewX(4deg); filter: hue-rotate(90deg); } 100% { opacity: 1; transform: none; filter: none; } }

/* water vs diet coke */
.versus { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; }
.tapper { border-radius: 12px; border: 3px solid #000; min-height: 112px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #fff;
  box-shadow: 0 6px 0 #000; font-family: 'Arcade', monospace; padding: 8px 4px; }
.tapper:active { transform: translateY(5px); box-shadow: 0 1px 0 #000; }
.tapper .n { font-size: 28px; text-shadow: 2px 2px 0 #000; }
.tapper .t { font-size: 9px; }
.tapper .e { font-size: 26px; font-family: system-ui; }
.tapper.water { background: linear-gradient(180deg, #2ad4ff, #0067d6); }
.tapper.coke { background: linear-gradient(180deg, #c9c9d1, #6b6b78); color: #111; }
.tapper.coke .n { color: #fff; }
.vs { align-self: center; font-family: 'NeonTube', 'Arcade', system-ui; font-size: 30px; color: var(--volt); text-shadow: 0 0 10px var(--volt); }
.vsbar { display: flex; height: 16px; border: 2px solid #000; border-radius: 4px; overflow: hidden; margin-top: 12px; background: #333; }
.vsbar .w { background: #19b8ff; } .vsbar .c { background: #b0b0bc; }
.minus-row { display: flex; justify-content: space-between; margin-top: 8px; }
.minus-row button { font-size: 12px; min-height: 34px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--muted); background: rgba(0,0,0,.35); color: var(--muted); cursor: pointer; }

/* recap / VHS label */
.vhs-label { background: linear-gradient(180deg, #f5f0e6, #e6dcc8); color: #1a1a1a; border-radius: 6px; padding: 10px 12px; border: 2px solid #000; position: relative; }
.vhs-label::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 8px; background: linear-gradient(90deg, var(--hot) 0 33%, var(--orange) 33% 66%, var(--volt) 66%); border-radius: 4px 4px 0 0; }
.vhs-label .lbl-title { font-family: 'Arcade', monospace; font-size: 10px; margin: 6px 0 8px; display: flex; justify-content: space-between; }
.vhs-label .stat { background: #fff; border-color: #000; }
.vhs-label .stat b { color: #c4005a; text-shadow: none; font-size: 13px; }
.vhs-label .stat span { color: #333; }
.spark { display: flex; align-items: flex-end; gap: 5px; height: 60px; margin-top: 10px; }
.spark div { flex: 1; background: linear-gradient(180deg, var(--hot), var(--purple)); border: 1px solid #000; border-radius: 2px 2px 0 0; min-height: 3px; position: relative; }
.spark div.empty { background: repeating-linear-gradient(45deg, #ccc 0 3px, #eee 3px 6px); }
.spark-days { display: flex; gap: 5px; font-size: 10px; color: #444; margin-top: 2px; } .spark-days span { flex: 1; text-align: center; }
.trend { font-weight: 700; } .trend.down { color: #00873c; } .trend.up { color: #c40030; } .trend.flat { color: #555; }

/* lists */
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed rgba(255,255,255,.15); }
.list li:last-child { border-bottom: 0; }
.list .name { flex: 1; min-width: 0; }
.list .name .s { display: block; font-size: 12px; color: var(--muted); }
.cal { font-family: 'Arcade', monospace; font-size: 11px; color: var(--volt); white-space: nowrap; }
.add-btn { min-width: 44px; min-height: 44px; border-radius: 8px; border: 2px solid #000; background: var(--hot); color: #fff; font-size: 22px; font-weight: 800; cursor: pointer; box-shadow: 0 3px 0 #000; }
.add-btn:active { transform: translateY(3px); box-shadow: none; }
.del { background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; min-width: 36px; min-height: 36px; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; scrollbar-width: none; }
.chip { flex: none; min-height: 34px; padding: 6px 12px; border-radius: 999px; border: 2px solid var(--purple); background: rgba(0,0,0,.4); color: var(--text); font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--purple); color: #fff; box-shadow: 0 0 10px var(--purple); }
.tag { display: inline-block; font-family: 'Arcade', monospace; font-size: 7px; padding: 4px 5px; border-radius: 3px; background: var(--volt); color: #000; vertical-align: middle; margin-left: 4px; }
.tag.hot { background: var(--hot); color: #fff; }

.qp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.qp { text-align: left; border-radius: 10px; border: 2px solid #000; padding: 10px; cursor: pointer; min-height: 86px; color: #12002b;
  background: linear-gradient(135deg, var(--volt), color-mix(in srgb, var(--volt) 55%, var(--cyan))); box-shadow: 0 4px 0 #000; }
.qp:nth-child(3n+2) { background: linear-gradient(135deg, var(--cyan), color-mix(in srgb, var(--cyan) 55%, var(--purple))); }
.qp:nth-child(3n) { background: linear-gradient(135deg, #ff8fc4, var(--hot)); color: #fff; }
.qp:active { transform: translateY(4px); box-shadow: none; }
.qp .e { font-size: 20px; } .qp b { display: block; font-size: 14px; line-height: 1.2; margin: 2px 0; } .qp .c { font-family: 'Arcade', monospace; font-size: 9px; }

/* leaderboard */
.board { background: #000; border: 3px solid var(--hot); border-radius: 8px; padding: 12px 10px; font-family: 'Arcade', monospace; box-shadow: 0 0 20px rgba(255,46,136,.35), 5px 5px 0 var(--cyan); margin-bottom: 14px; }
.board h4 { margin: 0 0 4px; font-size: 13px; text-align: center; color: var(--volt); text-shadow: 0 0 8px var(--volt); font-weight: 400; animation: blink 1.6s steps(2, start) infinite; }
.board .bsub { text-align: center; font-size: 8px; color: var(--cyan); margin-bottom: 10px; line-height: 1.6; }
.board table { width: 100%; border-collapse: collapse; font-size: 10px; }
.board th { color: var(--cyan); font-weight: 400; text-align: left; padding: 4px 3px; font-size: 8px; }
.board td { padding: 7px 3px; color: #fff; }
.board tr:nth-child(1) td { color: var(--volt); } .board tr:nth-child(2) td { color: var(--cyan); } .board tr:nth-child(3) td { color: var(--hot); }
.board td.r { text-align: right; } .board td.d { color: #999 !important; font-size: 8px; }
.board .empty { text-align: center; color: #888; font-size: 9px; padding: 10px; line-height: 1.7; }
@keyframes blink { 50% { opacity: .55; } }

.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.badge { text-align: center; padding: 10px 4px; border-radius: 10px; border: 2px dashed rgba(255,255,255,.25); background: rgba(0,0,0,.35); }
.badge .medal { width: 52px; height: 52px; margin: 0 auto 6px; border-radius: 50%; display: grid; place-items: center; font-size: 24px;
  background: conic-gradient(var(--hot), var(--orange), var(--volt), var(--cyan), var(--purple), var(--hot)); border: 3px solid #000; box-shadow: 0 0 12px var(--hot); }
.badge b { display: block; font-size: 12px; line-height: 1.2; } .badge span { font-family: 'Arcade', monospace; font-size: 7px; color: var(--muted); display: block; margin-top: 4px; line-height: 1.5; }
.badge.locked { opacity: .45; } .badge.locked .medal { background: #333; box-shadow: none; filter: grayscale(1); }
.badge.earned { border: 2px solid var(--volt); }

.themes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.theme-opt { border-radius: 10px; border: 2px solid #000; padding: 8px; min-height: 64px; cursor: pointer; color: #fff; text-align: left; font-size: 13px; font-weight: 700; position: relative; box-shadow: 0 3px 0 #000; }
.theme-opt .sw { display: flex; gap: 3px; margin-top: 6px; } .theme-opt .sw i { width: 18px; height: 10px; border-radius: 2px; border: 1px solid #000; }
.theme-opt[aria-pressed="true"] { outline: 3px solid var(--volt); outline-offset: 2px; }
.theme-opt:disabled { opacity: .45; cursor: not-allowed; }
.theme-opt .lock { position: absolute; right: 6px; top: 6px; font-family: 'Arcade', monospace; font-size: 7px; }

/* shoes */
.shoe { padding: 10px 0; border-bottom: 1px dashed rgba(255,255,255,.15); }
.shoe:last-child { border-bottom: 0; }
.shoe .st { font-family: 'Arcade', monospace; font-size: 8px; padding: 4px 6px; border-radius: 3px; border: 1px solid #000; }
.st.ok { background: var(--ok); color: #000; } .st.warn { background: var(--warn); color: #000; } .st.danger { background: var(--orange); color: #000; } .st.retire { background: var(--bad); color: #fff; }
.alert { border-radius: 10px; padding: 12px; margin-bottom: 14px; border: 2px solid #000; background: repeating-linear-gradient(-45deg, #ffd319 0 14px, #ffb000 14px 28px); color: #1a1000; font-weight: 600; box-shadow: 4px 4px 0 var(--hot); }
.alert.danger { background: repeating-linear-gradient(-45deg, #ff5a3c 0 14px, #ff2e2e 14px 28px); color: #fff; }

/* race countdown */
.countdown { display: flex; align-items: center; gap: 12px; }
.countdown .days { font-family: 'Arcade', monospace; font-size: 34px; color: var(--volt); text-shadow: 0 0 10px var(--volt), 3px 3px 0 var(--hot); line-height: 1; }
.countdown .lbl { font-family: 'Arcade', monospace; font-size: 8px; color: var(--cyan); margin-top: 6px; }

/* cassette */
.cassette { background: linear-gradient(180deg, #2a2a33, #111116); border: 3px solid #000; border-radius: 12px; padding: 10px; box-shadow: 5px 5px 0 var(--hot); margin-bottom: 14px; }
.cassette .label { background: linear-gradient(180deg, #fffbe9 0 60%, var(--hot) 60% 70%, var(--orange) 70% 80%, var(--volt) 80% 90%, var(--cyan) 90%); color: #111; border-radius: 6px; padding: 8px 10px 22px; border: 2px solid #000; }
.cassette .label .ttl { font-family: 'Arcade', monospace; font-size: 10px; display: flex; justify-content: space-between; }
.cassette .label .hand { font-family: "Comic Sans MS", "Marker Felt", "Segoe Print", cursive; font-size: 18px; margin-top: 4px; color: #1b2bd1; }
.cassette .window { display: flex; justify-content: space-between; align-items: center; margin: -14px 26px 0; background: #0b0b0f; border: 2px solid #000; border-radius: 22px; padding: 6px 16px; position: relative; }
.reel { width: 34px; height: 34px; border-radius: 50%; border: 5px dotted #ddd; background: #222; animation: spin 3s linear infinite; }
.reel.paused { animation-play-state: paused; }
@keyframes spin { to { transform: rotate(360deg); } }
.cassette .tape { flex: 1; height: 16px; margin: 0 8px; background: linear-gradient(180deg, #4a2a10, #2a1405); border-radius: 3px; }
.side { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15); border-radius: 8px; padding: 10px; margin-top: 10px; }
.side .bpm { font-family: 'Arcade', monospace; font-size: 22px; color: var(--volt); text-shadow: 0 0 8px var(--volt); }

/* before / after */
.ba { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ba .pane { border: 2px solid var(--cyan); border-radius: 10px; padding: 8px; text-align: center; background: rgba(0,0,0,.4); }
.ba .pane.after { border-color: var(--volt); }
.ba .photo { aspect-ratio: 3/4; border-radius: 6px; background: repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 8px, transparent 8px 16px); display: grid; place-items: center; overflow: hidden; margin-bottom: 6px; color: var(--muted); font-size: 12px; }
.ba .photo img { width: 100%; height: 100%; object-fit: cover; }
.ba .w { font-family: 'Arcade', monospace; font-size: 16px; color: var(--cyan); } .ba .after .w { color: var(--volt); }
.ba .tl { font-family: 'Arcade', monospace; font-size: 9px; margin-bottom: 6px; }

/* overlays */
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60; background: #000; color: var(--volt); border: 2px solid var(--volt);
  padding: 10px 14px; border-radius: 8px; font-size: 14px; display: none; gap: 10px; align-items: center; box-shadow: 0 0 14px var(--volt); max-width: 92vw; }
.toast.show { display: flex; }
.toast button { background: var(--hot); color: #fff; border: 0; border-radius: 6px; padding: 6px 10px; font-weight: 700; cursor: pointer; }
.overlay { position: fixed; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(5,0,15,.92); }
.overlay.show { display: flex; }
.celebrate { width: 100%; max-width: 420px; text-align: center; border: 4px solid var(--volt); border-radius: 14px; padding: 22px 16px; position: relative; overflow: hidden;

<script>
/* Fitness Arcade — pure logic (no DOM). Works in browser (window.FA) and Node (module.exports). */
(function (root) {
  'use strict';

  // ---------- dates ----------
  function pad(n) { return String(n).padStart(2, '0'); }
  function toISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseISO(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(iso, n) { var d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
  function dayDiff(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
  function weekStart(iso) { // Monday
    var d = parseISO(iso); var dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return toISO(d);
  }
  function fmtShort(iso) {
    var d = parseISO(iso);
    return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()] + ' ' + d.getDate();
  }

  // ---------- time / pace ----------
  // "25:30" -> 25.5 min ; "1:05:00" -> 65 ; "42" -> 42
  function parseDuration(str) {
    if (str == null) return NaN;
    str = String(str).trim();
    if (!str) return NaN;
    if (!/^\d+(\.\d+)?(:\d{1,2}){0,2}$/.test(str)) return NaN;
    var parts = str.split(':').map(Number);
    if (parts.length === 1) return parts[0];
    if (parts.length === 2) { if (parts[1] >= 60) return NaN; return parts[0] + parts[1] / 60; }
    if (parts[1] >= 60 || parts[2] >= 60) return NaN;
    return parts[0] * 60 + parts[1] + parts[2] / 60;
  }
  function fmtPace(minPerMile) {
    if (!isFinite(minPerMile) || minPerMile <= 0) return '--:--';
    var total = Math.round(minPerMile * 60);
    return Math.floor(total / 60) + ':' + pad(total % 60);
  }
  function fmtDuration(min) {
    if (!isFinite(min)) return '--';
    var s = Math.round(min * 60), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return h ? h + ':' + pad(m) + ':' + pad(sec) : m + ':' + pad(sec);
  }
  function pace(run) { return run.miles > 0 ? run.minutes / run.miles : Infinity; }
  function round1(n) { return Math.round(n * 10) / 10; }

  // ---------- streaks ----------
  function runDays(runs) {
    var set = {}; runs.forEach(function (r) { if (r.miles > 0) set[r.date] = true; });
    return Object.keys(set).sort();
  }
  function streakSegments(runs) {
    var days = runDays(runs), segs = [], cur = null;
    days.forEach(function (d) {
      if (cur && dayDiff(cur.end, d) === 1) { cur.end = d; cur.days++; }
      else { cur = { start: d, end: d, days: 1 }; segs.push(cur); }
    });
    return segs;
  }
  function longestStreak(runs) {
    return streakSegments(runs).reduce(function (m, s) { return s.days > m ? s.days : m; }, 0);
  }
  // current streak: counts if the last run was today or yesterday (still alive)
  function currentStreak(runs, today) {
    var segs = streakSegments(runs); if (!segs.length) return 0;
    var last = segs[segs.length - 1];
    var gap = dayDiff(last.end, today);
    return (gap === 0 || gap === 1) ? last.days : 0;
  }

  // ---------- weeks ----------
  function weeklyMiles(runs) {
    var m = {}; runs.forEach(function (r) { var w = weekStart(r.date); m[w] = (m[w] || 0) + r.miles; });
    return Object.keys(m).sort().map(function (w) { return { week: w, miles: round1(m[w]) }; });
  }

  // ---------- high scores ----------
  function highScores(runs, n) {
    n = n || 5;
    var streaks = streakSegments(runs).slice().sort(function (a, b) { return b.days - a.days || (a.end < b.end ? 1 : -1); })
      .slice(0, n).map(function (s) { return { score: s.days, label: s.days + (s.days === 1 ? ' DAY' : ' DAYS'), date: s.end, detail: fmtShort(s.start) + '–' + fmtShort(s.end) }; });
    var paces = runs.filter(function (r) { return r.miles >= 1 && r.minutes > 0; })
      .slice().sort(function (a, b) { return pace(a) - pace(b); })
      .slice(0, n).map(function (r) { return { score: pace(r), label: fmtPace(pace(r)) + '/MI', date: r.date, detail: round1(r.miles) + ' mi' }; });
    var weeks = weeklyMiles(runs).slice().sort(function (a, b) { return b.miles - a.miles; })
      .slice(0, n).map(function (w) { return { score: w.miles, label: w.miles.toFixed(1) + ' MI', date: w.week, detail: 'wk of ' + fmtShort(w.week) }; });
    return { streak: streaks, pace: paces, weekly: weeks };
  }

  // ---------- weight / levels / badges ----------
  function latestWeight(weights) {
    if (!weights.length) return null;
    return weights.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; })[weights.length - 1].lbs;
  }
  function lbsLost(profile, weights) {
    var w = latestWeight(weights); if (w == null || !profile.startWeight) return 0;
    return Math.max(0, round1(profile.startWeight - w));
  }
  function totalMiles(runs) { return round1(runs.reduce(function (s, r) { return s + (r.miles || 0); }, 0)); }

  var WEIGHT_STEP = 10, MILE_STEP = 50;
  var WEIGHT_BADGES = ['Leg Warmer', 'Sweatband', 'Boombox', 'Power Suit', 'Neon Ninja', 'Laser Tag Legend', 'Totally Tubular', 'Radical Rocket', 'Gnarly Guardian', 'Mega Champion'];
  var MILE_BADGES = ['Walkman', 'Moonwalker', 'Hi-Top Hero', 'Arcade Ace', 'Turbo Racer', 'Synth Sprinter', 'Grid Runner', 'Time Traveler', 'Hyperdrive', 'Marathon Mainframe'];

  function levelInfo(profile, weights, runs) {
    var lost = lbsLost(profile, weights), miles = totalMiles(runs);
    var wl = Math.floor(lost / WEIGHT_STEP), ml = Math.floor(miles / MILE_STEP);
    var badges = [];
    for (var i = 0; i < Math.max(wl, 0) + 3 && i < 30; i++) {
      badges.push({ id: 'w' + (i + 1), kind: 'weight', at: (i + 1) * WEIGHT_STEP, name: WEIGHT_BADGES[i % WEIGHT_BADGES.length] + (i >= WEIGHT_BADGES.length ? ' ' + (Math.floor(i / WEIGHT_BADGES.length) + 1) : ''), earned: i < wl, title: (i + 1) * WEIGHT_STEP + ' LBS LOST' });
    }
    for (var j = 0; j < Math.max(ml, 0) + 3 && j < 60; j++) {
      badges.push({ id: 'm' + (j + 1), kind: 'miles', at: (j + 1) * MILE_STEP, name: MILE_BADGES[j % MILE_BADGES.length] + (j >= MILE_BADGES.length ? ' ' + (Math.floor(j / MILE_BADGES.length) + 1) : ''), earned: j < ml, title: (j + 1) * MILE_STEP + ' MILES RUN' });
    }
    return {
      lbsLost: lost, totalMiles: miles, weightLevels: wl, mileLevels: ml, level: 1 + wl + ml,
      nextWeight: { have: round1(lost - wl * WEIGHT_STEP), need: WEIGHT_STEP, target: (wl + 1) * WEIGHT_STEP },
      nextMiles: { have: round1(miles - ml * MILE_STEP), need: MILE_STEP, target: (ml + 1) * MILE_STEP },
      badges: badges, earnedBadges: badges.filter(function (b) { return b.earned; })
    };
  }

  var THEMES = [
    { id: 'sunset', name: 'Synthwave Sunset', unlockAt: 1 },
    { id: 'miami', name: 'Miami Nights', unlockAt: 2 },
    { id: 'arcade', name: 'Arcade Cabinet', unlockAt: 3 },
    { id: 'volt', name: 'Volt Trainer', unlockAt: 4 },
    { id: 'jazzercise', name: 'Jazzercise', unlockAt: 5 },
    { id: 'chrome', name: 'Chrome Gold', unlockAt: 6 }
  ];
  function themesFor(level) { return THEMES.map(function (t) { return Object.assign({}, t, { unlocked: level >= t.unlockAt }); }); }

  // ---------- shoes ----------
  function shoeMiles(shoe, runs) {
    return round1((shoe.startMiles || 0) + runs.reduce(function (s, r) { return s + (r.shoeId === shoe.id ? r.miles : 0); }, 0));
  }
  function shoeStatus(miles) {
    if (miles >= 500) return { level: 'retire', label: 'RETIRE THEM', msg: 'Past 500 mi — cushioning is likely done. Time for a new pair.' };
    if (miles >= 400) return { level: 'danger', label: 'REPLACE SOON', msg: 'In the 400–500 mi zone. Start shopping for a new pair.' };
    if (miles >= 300) return { level: 'warn', label: 'CHECK WEAR', msg: 'Hit 300 mi — watch for flat cushioning or aches.' };
    return { level: 'ok', label: 'FRESH', msg: (300 - miles).toFixed(0) + ' mi until the 300-mi check.' };
  }

  // ---------- food / calories ----------
  function dayCalories(food, date) { return food.reduce(function (s, f) { return s + (f.date === date ? f.cal : 0); }, 0); }
  function searchFoods(db, q) {
    q = (q || '').toLowerCase().trim();
    if (!q) return [];
    var terms = q.split(/\s+/);
    return db.filter(function (f) {
      var hay = (f.name + ' ' + (f.chain || '') + ' ' + (f.tags || '')).toLowerCase();
      return terms.every(function (t) { return hay.indexOf(t) !== -1; });
    }).sort(function (a, b) {
      var an = a.name.toLowerCase().indexOf(q) === 0 ? 0 : 1, bn = b.name.toLowerCase().indexOf(q) === 0 ? 0 : 1;
      return an - bn || a.cal - b.cal;
    });
  }
  // smart drive-thru pick: <= 350 cal and >= 12 g protein per 200 cal (protein density)
  function isSmartPick(item) { return item.cal <= 350 && item.protein != null && item.protein / item.cal >= 0.06; }

  // ---------- weekly recap (7 days ending today, vs prior 7) ----------
  function weeklyRecap(state, today) {
    var start = addDays(today, -6), pStart = addDays(today, -13), pEnd = addDays(today, -7);
    function inRange(d, a, b) { return d >= a && d <= b; }
    var runs = state.runs.filter(function (r) { return inRange(r.date, start, today); });
    var prevRuns = state.runs.filter(function (r) { return inRange(r.date, pStart, pEnd); });
    var miles = runs.reduce(function (s, r) { return s + r.miles; }, 0);
    var mins = runs.reduce(function (s, r) { return s + r.minutes; }, 0);
    var prevMiles = prevRuns.reduce(function (s, r) { return s + r.miles; }, 0);
    var days = [];
    for (var i = 0; i < 7; i++) {
      var d = addDays(start, i);
      days.push({ date: d, cal: dayCalories(state.food, d), logged: state.food.some(function (f) { return f.date === d; }) });
    }
    function avgCal(a, b) {
      var tot = 0, n = 0;
      for (var d = a; d <= b; d = addDays(d, 1)) {
        if (state.food.some(function (f) { return f.date === d; })) { tot += dayCalories(state.food, d); n++; }
      }
      return n ? Math.round(tot / n) : null;
    }
    var avg = avgCal(start, today), prevAvg = avgCal(pStart, pEnd);
    var trend = (avg == null || prevAvg == null) ? 'flat' : (avg < prevAvg - 25 ? 'down' : avg > prevAvg + 25 ? 'up' : 'flat');
    // weight change across window
    var ws = state.weights.filter(function (w) { return inRange(w.date, addDays(start, -1), today); }).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var wChange = ws.length >= 2 ? round1(ws[ws.length - 1].lbs - ws[0].lbs) : null;
    return {

      var id = x.nutrientId, num = String(x.nutrientNumber || ''), unit = String(x.unitName || '').toUpperCase();
      if ((id === 1008 || num === '208') && unit === 'KCAL') kcal = x.value;
      else if ((id === 2047 || id === 2048 || num === '957' || num === '958') && unit === 'KCAL' && kcal == null) kcal = x.value;

        if (!servings.some(function (s) { return s.label === label; })) servings.push({ label: label + ' (' + r0(m.gramWeight) + ' g)', grams: m.gramWeight });
      });
      if (f.servingSize && /^g$/i.test(f.servingSizeUnit || '')) servings.unshift({ label: (f.householdServingFullText || 'serving') + ' (' + r0(f.servingSize) + ' g)', grams: f.servingSize });

<script>
/* Fitness Arcade — UI */
(function () {
  'use strict';

  var KEY = 'fitnessArcade.v1', PHOTO_KEY = 'fitnessArcade.photos';
  var params = new URLSearchParams(location.search);
  function today() { return params.get('today') || F.toISO(new Date()); }
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(sel, el) { return (el || document).querySelector(sel); }

  function blank() {
    return { v: 1, profile: { initials: 'JON', startWeight: null, startDate: null, goalWeight: null, calGoal: 2000, waterGoal: 8 },
      weights: [], runs: [], food: [], shoes: [], activeShoe: null, drinks: {}, race: null, theme: 'sunset',
      celebrated: { milestone: 0, badges: [] }, ui: { tab: 'home', chain: 'All', smartOnly: false },
      journey: { id: 'natchez', startDate: null },
      weather: { loc: { name: 'Murfreesboro, TN', lat: 35.8456, lon: -86.3903 }, cache: null } };
  }
  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return Object.assign(blank(), s); } catch (e) {}
    return blank();
  }
  var state = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { toast('Storage full — could not save'); } }
  function photos() { try { return JSON.parse(localStorage.getItem(PHOTO_KEY)) || {}; } catch (e) { return {}; } }

  // ---------- toast / overlays ----------
  var toastTimer, undoFn;
  function toast(msg, undo) {
    var t = $('#toast'); undoFn = undo || null;
    t.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button data-action="undo">UNDO</button>' : '');
    t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3500);
  }
  function overlay(html) { var o = $('#overlay'); o.innerHTML = html; o.classList.add('show'); }
  function closeOverlay() { $('#overlay').classList.remove('show'); $('#overlay').innerHTML = ''; }

  // ---------- derived ----------
  function info() { return F.levelInfo(state.profile, state.weights, state.runs); }
  function activeShoe() { return state.shoes.filter(function (s) { return s.id === state.activeShoe && !s.retired; })[0] || null; }

  // ---------- achievements (celebrations) ----------
  function snapshot() {
    var li = info(), hs = F.highScores(state.runs, 1);
    return { lost: li.lbsLost, badges: li.earnedBadges.map(function (b) { return b.id; }), level: li.level,
      bestPace: hs.pace[0] ? hs.pace[0].score : Infinity, streak: hs.streak[0] ? hs.streak[0].score : 0, week: hs.weekly[0] ? hs.weekly[0].score : 0 };
  }
  function afterChange(before) {
    var li = info(), now = snapshot();
    var newBadges = li.earnedBadges.filter(function (b) { return before.badges.indexOf(b.id) === -1 && state.celebrated.badges.indexOf(b.id) === -1; });
    var newThemes = F.themesFor(now.level).filter(function (t) { return t.unlocked && t.unlockAt > before.level; });
    var ms = F.crossedMilestone(before.lost, now.lost);
    if (ms && ms > (state.celebrated.milestone || 0)) {
      state.celebrated.milestone = ms;
      newBadges.forEach(function (b) { state.celebrated.badges.push(b.id); });
      save(); showHighScore(ms, newBadges, newThemes); return;
    }
    if (newBadges.length) {
      newBadges.forEach(function (b) { state.celebrated.badges.push(b.id); });
      save(); showLevelUp(newBadges, newThemes); return;
    }
    var msgs = [];
    if (state.runs.length > 1) {
      if (now.bestPace < before.bestPace && before.bestPace !== Infinity) msgs.push('best pace');
      if (now.streak > before.streak && before.streak > 0) msgs.push('longest streak');
      if (now.week > before.week && before.week > 0) msgs.push('weekly miles');
    }
    if (msgs.length) toast('★ NEW HIGH SCORE: ' + msgs.join(' + ') + '!');
  }
  function unlockHtml(badges, themes) {
    var h = '';
    badges.forEach(function (b) { h += '<div>🏅 Badge: <b>' + esc(b.name) + '</b> <span class="muted">(' + esc(b.title) + ')</span></div>'; });
    themes.forEach(function (t) { h += '<div>🎨 Theme unlocked: <b>' + esc(t.name) + '</b></div>'; });
    return h;
  }
  function showHighScore(lbs, badges, themes) {
    var ba = F.beforeAfter(state.profile, state.weights);
    overlay('<div class="celebrate" role="dialog" aria-label="New high score"><div class="stars"></div>' +
      '<div class="hs">NEW<br>HIGH SCORE!</div><div class="score">-' + lbs + ' LBS</div>' +

      '<div class="initials">' + esc(state.profile.initials || 'JON') + '</div>' +
      '<div class="unlocks">' + unlockHtml(badges, themes) + '</div>' +
      '<div class="row" style="justify-content:center"><button class="btn" data-action="show-ba">BEFORE / AFTER</button><button class="btn pink" data-action="close-overlay">CONTINUE</button></div></div>');
  }
  function showGhost(gc) {
    overlay('<div class="celebrate" role="dialog" aria-label="Ghost race"><div class="stars"></div><div class="hs">' + (gc.ahead ? 'GHOST<br>BUSTED!' : gc.tie ? 'DEAD<br>HEAT!' : 'GHOST<br>WINS') + '</div>' +
      '<div class="score" style="font-size:30px">' + (gc.tie ? '±0:00' : (gc.ahead ? '-' : '+') + F.fmtDuration(Math.abs(gc.deltaSec) / 60)) + '</div>' + ghostHtml(gc, false) +
      '<button class="btn pink" style="margin-top:14px" data-action="close-overlay">' + (gc.ahead ? 'CONTINUE' : 'RETRY NEXT TIME') + '</button></div>');
  }
  function showPostcard(c) {
    var j = journey();
    overlay('<div class="celebrate" role="dialog" aria-label="Postcard"><div class="stars"></div><div class="hs" style="font-size:16px">NEW POSTCARD!</div><div class="postcard pc1" style="margin:16px 0;text-align:left"><div class="greet">GREETINGS FROM</div><div class="place">' + esc(c.name) + '</div><div class="blurb">' + esc(c.blurb) + '</div><div class="stamp">' + esc(j.name) + '<br>MI ' + c.at + '</div></div>' +
      '<button class="btn pink" data-action="close-overlay">CONTINUE</button></div>');
  }
  function showLevelUp(badges, themes) {
    overlay('<div class="celebrate" role="dialog" aria-label="Level up"><div class="stars"></div><div class="hs">LEVEL UP!</div>' +
      '<div class="score">LV ' + info().level + '</div><div class="unlocks">' + unlockHtml(badges, themes) + '</div>' +

  // ---------- render helpers ----------

  }
  function header() {
    var li = info();
    return '<header class="top"><h1 class="logo">Fitness Arcade<small>INSERT COIN · RUN · FUEL</small></h1>' +
      '<div class="row"><span class="lvl-pill" aria-label="Level">LV ' + li.level + '</span><button class="icon-btn" data-action="settings" aria-label="Settings">⚙</button></div></header>';
  }
  function title(t) { return '<h2 class="screen-title">' + t + '</h2><div class="stripes"></div>'; }

  // ---------- HOME ----------
  function renderHome() {
    var t = today(), li = info(), cal = F.dayCalories(state.food, t), goal = state.profile.calGoal || 2000;
    var dr = F.drinksFor(state, t), tot = dr.water + dr.coke;
    var shoe = activeShoe(), h = title('Home');
    if (shoe) {
      var sm = F.shoeMiles(shoe, state.runs), st = F.shoeStatus(sm);
      if (st.level !== 'ok') h += '<div class="alert ' + (st.level === 'warn' ? '' : 'danger') + '" data-testid="shoe-alert">👟 ' + esc(shoe.name) + ': ' + sm.toFixed(0) + ' mi — ' + st.label + '. ' + esc(st.msg) + '</div>';
    }
    // today
    h += '<section class="card memphis"><h3>TODAY · ' + F.fmtShort(t).toUpperCase() + '</h3>' +
      '<div class="row spread"><div><div class="big-num" data-testid="cal-today">' + cal + '</div><div class="muted">of ' + goal + ' cal · ' + Math.max(goal - cal, 0) + ' left</div></div>' +
      '<div style="text-align:right"><div class="big-num" style="color:var(--volt);text-shadow:0 0 10px var(--volt)">' + F.currentStreak(state.runs, t) + '</div><div class="muted">day run streak</div></div></div>' +
      '<div style="margin-top:10px">' + bar(cal / goal * 100, cal > goal ? '' : 'cyan') + '</div>' +
      '<div class="row" style="margin-top:12px"><button class="btn block" data-goto="food">+ FOOD</button><button class="btn pink block" data-goto="run">+ RUN</button></div></section>';
    // water vs coke
    h += '<section class="card hot" data-testid="versus"><h3>WATER VS DIET COKE<span class="sub">Tap to count today’s drinks · goal ' + state.profile.waterGoal + ' waters</span></h3>' +
      '<div class="versus"><button class="tapper water" data-action="drink" data-kind="water" aria-label="Add water"><span class="e">💧</span><span class="n" data-testid="water-count">' + dr.water + '</span><span class="t">WATER</span></button>' +
      '<div class="vs">VS</div>' +
      '<button class="tapper coke" data-action="drink" data-kind="coke" aria-label="Add Diet Coke"><span class="e">🥤</span><span class="n" data-testid="coke-count">' + dr.coke + '</span><span class="t">DIET COKE</span></button></div>' +
      '<div class="vsbar" aria-hidden="true"><div class="w" style="flex:' + (tot ? dr.water : 1) + '"></div><div class="c" style="flex:' + (tot ? dr.coke : 1) + '"></div></div>' +
      '<div class="minus-row"><button data-action="undrink" data-kind="water">− water</button><span class="muted small">' + (tot ? (dr.water >= dr.coke ? '💧 Water is winning!' : '🥤 Diet Coke leads — hydrate!') : 'Round 1 — FIGHT!') + '</span><button data-action="undrink" data-kind="coke">− coke</button></div></section>';
    // race countdown
    var r = F.raceInfo(state.race, t, state.runs);
    if (r) {
      h += '<section class="card volt" data-testid="race-card"><h3>RACE COUNTDOWN<span class="sub">' + esc(r.name) + ' · ' + esc(r.distance) + ' · ' + F.fmtShort(r.date) + '</span></h3>';
      if (r.past) h += '<div class="muted">Race day has passed. Set your next race on the RUN screen.</div>';
      else {
        h += '<div class="countdown"><div><div class="days" data-testid="race-days">' + (r.raceDay ? 'GO!' : r.days) + '</div><div class="lbl">' + (r.raceDay ? 'RACE DAY' : (r.days === 1 ? 'DAY LEFT' : 'DAYS LEFT')) + '</div></div><div class="grow">';
        if (r.requiredPace) {
          h += '<div>Target <b>' + esc(r.targetTime) + '</b> → need <b data-testid="race-pace" style="color:var(--volt)">' + F.fmtPace(r.requiredPace) + '/mi</b></div>';
          if (r.recentAvgPace) {

            h += '<div class="muted small">Recent avg ' + F.fmtPace(r.recentAvgPace) + '/mi · ' + (gap > 0 ? g + ' sec/mi to find' : 'already on pace ✔') + '</div>';
          }
        } else h += '<div class="muted small">No target time set. Recent avg pace: ' + (r.recentAvgPace ? F.fmtPace(r.recentAvgPace) + '/mi' : '—') + '</div>';
        h += '</div></div>';
      }
      h += '</section>';
    } else h += '<section class="card volt"><h3>RACE COUNTDOWN</h3><div class="muted">No race set yet.</div><button class="btn sm" style="margin-top:8px" data-action="race-form">SET A RACE</button></section>';
    h += weatherCard();
    h += journeyMini();
    h += recapCard(t);
    // level
    h += '<section class="card"><h3>LEVEL ' + li.level + '<span class="sub">Every 10 lbs lost or 50 miles run = level up + badge</span></h3>' +
      '<div class="small">⚖ ' + li.nextWeight.have + ' / 10 lbs to next</div>' + bar(li.nextWeight.have / 10 * 100, 'volt') +
      '<div class="small" style="margin-top:8px">🏃 ' + li.nextMiles.have + ' / 50 mi to next</div>' + bar(li.nextMiles.have / 50 * 100, 'cyan') + '</section>';
    var qt = Q.quoteFor(t);
    h += '<section class="quote-card" data-testid="daily-quote"><div class="q-sun" aria-hidden="true"></div><div class="q-label">DAILY DHARMA · ' + F.fmtShort(t).toUpperCase() + '</div>' +
      '<blockquote>“' + esc(qt.text) + '”</blockquote><div class="q-attr">— ' + esc(qt.author) + (qt.source ? '<span>' + esc(qt.source) + '</span>' : '') + '</div></section>';

  }
  function recapCard(t) {

  // ---------- WEATHER ----------
  var wxLoading = false, wxError = null;
  function locNowIso(data) { return new Date(Date.now() + (data.utc_offset_seconds || 0) * 1000).toISOString().slice(0, 16); }

  }

    }

    if (!tip.best) { var tmr = F.addDays(nowIso.slice(0, 10), 1); var t2 = F.weatherTips(c.data, tmr + 'T00:00'); if (t2.best) { tip.best = t2.best; when = 'Tomorrow'; } }
    if (tip.now) h += '<div class="row spread"><div><div class="big-num" style="font-size:22px">' + tip.now.temp + '°F</div><div class="muted small">feels ' + tip.now.feels + '° · ' + esc(tip.now.desc) + ' · wind ' + tip.now.wind + ' mph · rain ' + (tip.now.pop || 0) + '%</div></div>' +

    h += '<div class="muted small">Open-Meteo forecast · updated ' + new Date(c.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + (wxError ? ' · ' + esc(wxError) + ' (showing last forecast)' : '') + '</div></section>';
    return h;
  }
  function locModal() {
    var l = state.weather.loc;
    overlay('<div class="modal" role="dialog" aria-label="Weather location"><h3>WEATHER LOCATION</h3>' +
      '<form id="geo-form" class="row"><input id="geo-q" class="grow" placeholder="City, e.g. Nashville" aria-label="Search city"><button class="btn sm">FIND</button></form><ul class="list" id="geo-results"></ul>' +
      '<form id="loc-form" style="margin-top:12px"><div class="field"><label>Name</label><input name="name" value="' + esc(l.name) + '"></div><div class="grid2"><div class="field"><label>Latitude</label><input name="lat" type="number" step="any" min="-90" max="90" value="' + l.lat + '"></div><div class="field"><label>Longitude</label><input name="lon" type="number" step="any" min="-180" max="180" value="' + l.lon + '"></div></div>' +
      '<button class="btn block">SAVE LOCATION</button></form><button class="btn ghost block" style="margin-top:10px" data-action="wx-reset">RESET TO MURFREESBORO</button><button class="btn ghost block" style="margin-top:10px" data-action="close-overlay">CANCEL</button></div>');

  // ---------- online food search (USDA FoodData Central + Open Food Facts) ----------

  // ---------- PROGRESS ----------
  function weightChart() {
    var ws = state.weights.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    if (ws.length < 2) return '<div class="empty-note">Log at least 2 weigh-ins to see the chart.</div>';
    var W = 340, H = 170, pad = 30, vals = ws.map(function (w) { return w.lbs; });
    var goal = state.profile.goalWeight;
    var lo = Math.min.apply(null, vals.concat(goal ? [goal] : [])) - 2, hi = Math.max.apply(null, vals.concat(state.profile.startWeight ? [state.profile.startWeight] : [])) + 2;
    var t0 = F.parseISO(ws[0].date).getTime(), t1 = F.parseISO(ws[ws.length - 1].date).getTime() || t0 + 1;
    function x(d) { return pad + (F.parseISO(d).getTime() - t0) / Math.max(t1 - t0, 1) * (W - pad - 10); }
    function y(v) { return 10 + (hi - v) / (hi - lo) * (H - 30); }
    var pts = ws.map(function (w) { return x(w.date).toFixed(1) + ',' + y(w.lbs).toFixed(1); }).join(' ');
    var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Weight chart">';
    for (var i = 0; i <= 4; i++) { var v = lo + (hi - lo) * i / 4; s += '<line x1="' + pad + '" x2="' + (W - 10) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="rgba(255,255,255,.12)"/><text x="2" y="' + (y(v) + 4) + '" fill="var(--muted)" font-size="10">' + Math.round(v) + '</text>'; }
    if (goal) s += '<line x1="' + pad + '" x2="' + (W - 10) + '" y1="' + y(goal) + '" y2="' + y(goal) + '" stroke="var(--volt)" stroke-dasharray="5 4"/><text x="' + (W - 60) + '" y="' + (y(goal) - 4) + '" fill="var(--volt)" font-size="10">GOAL ' + goal + '</text>';
    s += '<polyline points="' + pts + '" fill="none" stroke="var(--hot)" stroke-width="3" style="filter:drop-shadow(0 0 4px var(--hot))"/>';
    ws.forEach(function (w) { s += '<circle cx="' + x(w.date) + '" cy="' + y(w.lbs) + '" r="3" fill="var(--cyan)"/>'; });
    s += '<text x="' + pad + '" y="' + (H - 4) + '" fill="var(--muted)" font-size="10">' + F.fmtShort(ws[0].date) + '</text><text x="' + (W - 50) + '" y="' + (H - 4) + '" fill="var(--muted)" font-size="10">' + F.fmtShort(ws[ws.length - 1].date) + '</text></svg>';
    return s;
  }
  function weekChart() {

    overlay('<div class="modal" role="dialog" aria-label="Race goal"><h3>RACE GOAL</h3><form id="race-form">' +
      '<div class="field"><label for="race-name">Race name</label><input id="race-name" name="name" value="' + esc(r.name || '') + '" placeholder="Turkey Trot" required></div>' +
      '<div class="grid2"><div class="field"><label for="race-dist">Distance</label><select id="race-dist" name="distance">' + Object.keys(F.RACE_DISTANCES).map(function (k) { return '<option' + (r.distance === k ? ' selected' : '') + '>' + k + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="race-date">Date</label><input id="race-date" name="date" type="date" min="' + today() + '" value="' + esc(r.date || '') + '" required></div></div>' +
      '<div class="field"><label for="race-target">Target time (optional, h:mm:ss or mm:ss)</label><input id="race-target" name="targetTime" value="' + esc(r.targetTime || '') + '" placeholder="55:00"></div>' +
      '<button class="btn pink block">SAVE RACE</button></form><button class="btn ghost block" style="margin-top:12px" data-action="close-overlay">CANCEL</button></div>');
  }

  // ---------- demo data ----------
  function demo() {
    var t = today(), s = blank(), rnd = 7;
    function rand() { rnd = (rnd * 9301 + 49297) % 233280; return rnd / 233280; }
    s.profile = { initials: 'JON', startWeight: 248, startDate: F.addDays(t, -120), goalWeight: 215, calGoal: 2100, waterGoal: 8 };
    s.shoes = [{ id: 'sh1', name: 'Brooks Ghost 15', startMiles: 120, retired: true }, { id: 'sh2', name: 'Nike Pegasus 41', startMiles: 150 }];
    s.activeShoe = 'sh2';
    for (var i = 120; i >= 0; i--) {
      var d = F.addDays(t, -i), dow = F.parseISO(d).getDay();
      var run = (dow !== 1 && rand() > 0.32) || (i <= 8 && i >= 1);
      if (run && i !== 0) {
        var miles = F.round1(2 + rand() * 3 + (dow === 6 ? 3 : 0) + (120 - i) / 60);
        var pace = 11.4 - (120 - i) / 60 + rand() * 0.9;
        var rt = null;
        if (dow === 3) { rt = 'Stones River Greenway'; miles = 4.2; }
        if (dow === 5) { rt = 'Barfield Crescent loop'; miles = 3.1; }
        var mood = Math.max(1, Math.min(5, Math.round(3 + (rand() - 0.5) * 3 + (pace < 10.5 ? 0.8 : -0.4)))), energy = Math.max(1, Math.min(5, Math.round(mood + (rand() - 0.5) * 2)));
        var notes = ['Legs felt fresh', 'Humid, took it easy', 'Slept badly', 'Great tunes, negative split', 'Windy on the back half', 'Easy recovery shuffle'];
        s.runs.push({ id: 'r' + i, date: d, miles: miles, minutes: F.round1(miles * (pace + (3 - energy) * 0.15)), cadence: Math.round(158 + (120 - i) / 24 + rand() * 4), shoeId: i > 70 ? 'sh1' : 'sh2',
          route: rt, mood: i < 60 ? mood : null, energy: i < 60 ? energy : null, note: i < 60 && rand() > 0.6 ? notes[Math.floor(rand() * notes.length)] : null });
      }
      if (i % 4 === 0) s.weights.push({ id: 'w' + i, date: d, lbs: F.round1(248 - (120 - i) * 0.165 + (rand() - 0.5) * 1.2) });
    }
    s.weights[0].lbs = 248;
    var picks = D.BREAKFAST_PICKS, mains = D.FOODS;
    for (var j = 13; j >= 0; j--) {
      var dd = F.addDays(t, -j), target = j > 6 ? 2150 : 1900;
      var p = picks[j % picks.length]; s.food.push({ id: 'fb' + j, date: dd, name: p.name, cal: p.cal });
      if (j === 0) { s.food.push({ id: 'fd0', date: dd, name: 'Starbucks Egg White & Roasted Red Pepper Egg Bites', cal: 170 }); s.food.push({ id: 'fd1', date: dd, name: 'Chicken breast, 4 oz cooked', cal: 187 }); s.food.push({ id: 'fd2', date: dd, name: 'Brown rice, 1 cup cooked', cal: 216 }); continue; }
      var left = target - p.cal + Math.round((rand() - 0.5) * 300);
      s.food.push({ id: 'fl' + j, date: dd, name: 'Turkey sandwich', cal: 350 }); left -= 350;
      s.food.push({ id: 'fdn' + j, date: dd, name: 'Dinner', cal: left });
    }
    s.drinks[t] = { water: 5, coke: 2 };
    s.race = { name: 'Turkey Trot', distance: '10K', date: F.addDays(t, 46), targetTime: '58:00' };
    var li = F.levelInfo(s.profile, s.weights, s.runs);
    s.celebrated = { milestone: F.weightMilestone(li.lbsLost), badges: li.earnedBadges.map(function (b) { return b.id; }) };
    s.theme = 'sunset';
    s.journey = { id: 'natchez', startDate: null };
    if (state && state.weather) s.weather = state.weather;
    return s;
  }

  // ---------- photos ----------
  function savePhoto(kind, file) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 720, sc = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var ph = photos(); ph[kind] = c.toDataURL('image/jpeg', 0.8);
        try { localStorage.setItem(PHOTO_KEY, JSON.stringify(ph)); toast('Photo saved on this device'); } catch (e) { toast('Photo too big for browser storage'); }
        render();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  // ---------- main render ----------
  var SCREENS = { home: renderHome, food: renderFood, run: renderRun, map: renderMap, progress: renderProgress, scores: renderScores };
  function render() {
    document.documentElement.setAttribute('data-theme', state.theme || 'sunset');
    var tab = state.ui.tab in SCREENS ? state.ui.tab : 'home';
    $('#main').innerHTML = header() + '<div class="screen active" data-screen="' + tab + '">' + SCREENS[tab]() + '</div>';
    document.querySelectorAll('nav.tabs button').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.goto === tab); });
    if (tab === 'food') renderResults();
    if (tab === 'home') fetchWeather();
  }
  function go(tab) { state.ui.tab = tab; save(); render(); window.scrollTo(0, 0); }

  document.addEventListener('click', function (e) {
    var g = e.target.closest('[data-goto]'); if (g) { go(g.dataset.goto); return; }
    var a = e.target.closest('[data-action]'); if (!a) { if (e.target.id === 'overlay') closeOverlay(); return; }
    var act = a.dataset.action, id = a.dataset.id, t = today(), before;
    switch (act) {
      case 'drink': case 'undrink':
        var dr = state.drinks[t] = Object.assign({ water: 0, coke: 0 }, state.drinks[t]);
        dr[a.dataset.kind] = Math.max(0, dr[a.dataset.kind] + (act === 'drink' ? 1 : -1)); save(); render(); break;
      case 'add-food': case 'add-pick': addFood(findFood(id)); break;
      case 'online-pick': servingModal(onlineItems[id]); break;
      case 'del-food': state.food = state.food.filter(function (f) { return f.id !== id; }); save(); render(); break;
      case 'chain': state.ui.chain = a.dataset.chain; save(); render(); break;
      case 'smart': state.ui.smartOnly = !state.ui.smartOnly; save(); render(); break;
      case 'undo': if (undoFn) { undoFn(); undoFn = null; } $('#toast').classList.remove('show'); break;
      case 'del-run': state.runs = state.runs.filter(function (r) { return r.id !== id; }); save(); render(); break;
      case 'del-weight': state.weights = state.weights.filter(function (w) { return w.id !== id; }); save(); render(); break;
      case 'shoe-active': state.activeShoe = id; save(); render(); break;
      case 'shoe-retire': state.shoes.forEach(function (s) { if (s.id === id) s.retired = true; }); if (state.activeShoe === id) { var nx = state.shoes.filter(function (s) { return !s.retired; })[0]; state.activeShoe = nx ? nx.id : null; } save(); render(); break;
      case 'shoe-unretire': state.shoes.forEach(function (s) { if (s.id === id) s.retired = false; }); save(); render(); break;
      case 'theme': state.theme = id; save(); render(); break;
      case 'settings': settings(); break;
      case 'race-form': raceForm(); break;
      case 'race-clear': state.race = null; save(); render(); break;
      case 'close-overlay': closeOverlay(); break;
      case 'wx-loc': locModal(); break;
      case 'wx-refresh': fetchWeather(true); render(); break;
      case 'wx-reset': state.weather.loc = { name: 'Murfreesboro, TN', lat: 35.8456, lon: -86.3903 }; save(); closeOverlay(); render(); break;
      case 'geo-pick': state.weather.loc = { name: a.dataset.name, lat: +a.dataset.lat, lon: +a.dataset.lon }; save(); closeOverlay(); render(); break;
      case 'journey': state.journey = { id: id, startDate: state.journey.id === id ? state.journey.startDate : null }; save(); render(); break;
      case 'journey-restart': if (confirm('Restart this journey counting only runs from today?')) { state.journey.startDate = t; save(); render(); } break;
      case 'show-ba': closeOverlay(); go('progress'); setTimeout(function () { var el = $('[data-testid="before-after"]'); if (el) el.scrollIntoView(); }, 30); break;
      case 'photo-del': var ph = photos(); delete ph[a.dataset.kind]; localStorage.setItem(PHOTO_KEY, JSON.stringify(ph)); render(); break;
      case 'push': state.ui.push = a.checked; save(); render(); break;
      case 'demo': if (confirm('Replace your data with demo data?')) { state = demo(); save(); closeOverlay(); render(); } break;
      case 'reset': if (confirm('Erase ALL data on this device?')) { state = blank(); localStorage.removeItem(PHOTO_KEY); save(); closeOverlay(); render(); } break;
      case 'export':
        var blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' }), u = URL.createObjectURL(blob), l = document.createElement('a');
        l.href = u; l.download = 'fitness-arcade-' + t + '.json'; l.click(); setTimeout(function () { URL.revokeObjectURL(u); }, 1000); break;
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'food-q') { state.ui.q = e.target.value; renderResults(); }
    if (e.target.closest && e.target.closest('#run-form')) updateGhostPreview();
    if (e.target.closest && e.target.closest('#serving-form')) updateServing();
  });
  document.addEventListener('change', function (e) {
    if (e.target.closest && e.target.closest('#serving-form')) updateServing();
    if (e.target.dataset && e.target.dataset.action === 'ghost-route') { state.ui.ghostRoute = e.target.value; save(); render(); return; }
    var k = e.target.dataset && e.target.dataset.photo; if (k && e.target.files[0]) savePhoto(k, e.target.files[0]);
    if (e.target.id === 'import-file' && e.target.files[0]) {
      e.target.files[0].text().then(function (txt) { try { var s = JSON.parse(txt); if (s.v !== 1) throw 0; state = Object.assign(blank(), s); save(); closeOverlay(); render(); toast('Data imported'); } catch (x) { toast('Not a Fitness Arcade backup'); } });
    }
  });
  document.addEventListener('submit', function (e) {
    e.preventDefault(); var f = e.target, fd = new FormData(f), before;
    if (f.id === 'custom-food') { addFood({ name: fd.get('name').trim(), cal: +fd.get('cal') }); }
    if (f.id === 'run-form') {
      var mi = parseFloat(fd.get('miles')), min = F.parseDuration(fd.get('time'));
      if (!(mi > 0) || !(min > 0)) { toast('Enter miles and a time like 30:00'); return; }
      before = snapshot();
      var cad = parseInt(fd.get('cadence'), 10), route = (fd.get('route') || '').trim();
      var newRun = { id: uid(), date: fd.get('date'), miles: Math.round(mi * 100) / 100, minutes: min, cadence: cad > 0 ? cad : null, shoeId: fd.get('shoe') || null,
        route: route || null, mood: +fd.get('mood') || null, energy: +fd.get('energy') || null, note: (fd.get('note') || '').trim() || null };
      var gc = F.ghostCompare(state.runs, { route: route, miles: newRun.miles, minutes: min, beforeDate: newRun.date });
      var jBefore = F.journeyProgress(journey(), state.runs, state.journey.startDate).postcards.length;
      state.runs.push(newRun);
      var jAfter = F.journeyProgress(journey(), state.runs, state.journey.startDate);
      save(); render(); toast('Run saved: ' + mi + ' mi @ ' + F.fmtPace(min / mi) + '/mi');
      afterChange(before);
      if (!$('#overlay.show')) {
        if (gc && gc.ready) showGhost(gc);
        else if (jAfter.postcards.length > jBefore) showPostcard(jAfter.postcards[jAfter.postcards.length - 1]);
      }
    }
    if (f.id === 'shoe-form') {
      var sh = { id: uid(), name: fd.get('name').trim(), startMiles: parseFloat(fd.get('start')) || 0 };
      state.shoes.push(sh); if (!activeShoe()) state.activeShoe = sh.id; save(); render();
    }
    if (f.id === 'weight-form') {
      var lbs = parseFloat(fd.get('lbs')), d = fd.get('date') || today(); if (!(lbs > 0)) return;
      before = snapshot();
      if (!state.profile.startWeight) { state.profile.startWeight = lbs; state.profile.startDate = d; }
      state.weights = state.weights.filter(function (w) { return w.date !== d; });
      state.weights.push({ id: uid(), date: d, lbs: lbs }); save(); render(); toast('Weigh-in saved: ' + lbs + ' lbs'); afterChange(before);
    }
    if (f.id === 'race-form') {
      var tt = (fd.get('targetTime') || '').trim();
      if (tt && !(F.parseDuration(tt) > 0)) { toast('Target time like 55:00 or 1:59:00'); return; }
      state.race = { name: fd.get('name').trim(), distance: fd.get('distance'), date: fd.get('date'), targetTime: tt }; save(); closeOverlay(); render();
    }
    if (f.id === 'serving-form') {
      var g = servingGrams(); if (!g || !(g.grams > 0) || !(g.qty > 0)) { toast('Pick a serving size and amount'); return; }
      closeOverlay();
      addFood({ name: g.it.name + (g.it.brand ? ' (' + g.it.brand + ')' : '') + ' · ' + (g.qty !== 1 ? g.qty + ' × ' : '') + g.label, cal: API.kcalFor(g.it, g.grams, g.qty) });
      return;
    }
    if (f.id === 'geo-form') {
      var q = $('#geo-q').value.trim(); if (!q) return; $('#geo-results').innerHTML = '<li class="muted">Searching…</li>';
      fetch(F.geocodeUrl(q)).then(function (r) { return r.json(); }).then(function (d) {
        var res = d.results || [];
        $('#geo-results').innerHTML = res.length ? res.map(function (g) { var nm = g.name + (g.admin1 ? ', ' + g.admin1 : '') + (g.country_code && g.country_code !== 'US' ? ', ' + g.country_code : '');
          return '<li><div class="name">' + esc(nm) + '<span class="s">' + g.latitude.toFixed(3) + ', ' + g.longitude.toFixed(3) + '</span></div><button class="btn sm" data-action="geo-pick" data-name="' + esc(nm) + '" data-lat="' + g.latitude + '" data-lon="' + g.longitude + '">USE</button></li>'; }).join('') : '<li class="muted">No matches.</li>';
      }).catch(function () { $('#geo-results').innerHTML = '<li class="muted">Search failed — enter lat/lon manually.</li>'; });
      return;
    }
    if (f.id === 'loc-form') {
      var la = parseFloat(fd.get('lat')), lo = parseFloat(fd.get('lon'));
      if (!(la >= -90 && la <= 90 && lo >= -180 && lo <= 180)) { toast('Latitude/longitude out of range'); return; }
      state.weather.loc = { name: (fd.get('name') || '').trim() || (la.toFixed(2) + ', ' + lo.toFixed(2)), lat: la, lon: lo }; save(); closeOverlay(); render(); return;
    }
    if (f.id === 'settings-form') {
      var p = state.profile;
      p.initials = (fd.get('initials') || 'JON').toUpperCase().slice(0, 3); p.calGoal = +fd.get('calGoal') || 2000;
      p.startWeight = parseFloat(fd.get('startWeight')) || null; p.startDate = fd.get('startDate') || null;
      p.goalWeight = parseFloat(fd.get('goalWeight')) || null; p.waterGoal = +fd.get('waterGoal') || 8; p.usdaKey = (fd.get('usdaKey') || '').trim();
      save(); closeOverlay(); render();
    }
  });

  if (params.get('demo') === '1' && !localStorage.getItem(KEY)) { state = demo(); save(); }
  if (params.get('tab')) state.ui.tab = params.get('tab');
  window.FitnessArcade = { demo: demo, getState: function () { return state; }, setState: function (s) { state = s; save(); render(); }, render: render };
  render();
})();

</script>

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function (e) { console.warn('SW registration failed', e); }); });
}
