:root {
  --bg: #000; --bg1: #0a0b0d; --card: #111315; --card2: #181b1e; --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.14);
  --text: #f5f6f7; --muted: #A5ACAF; --dim: #6c7378; --green: #69BE28; --green-d: #4f9a1a; --green-a: rgba(105,190,40,.14);
  --navy: #002244; --navy2: #0b2d52; --warn: #f2b33d; --danger: #ff5a52;
  --r: 20px; --r-sm: 12px; --ease: cubic-bezier(.2,.8,.2,1);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; font-feature-settings: 'tnum' 1, 'cv11' 1; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--green); }
h1, h2, h3 { margin: 0; letter-spacing: -.02em; }
.app { max-width: 560px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 18px calc(104px + env(safe-area-inset-bottom)); }
.screen { animation: rise .35s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; height: 52px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg, .mark { width: 28px; height: 28px; }
.word { font-weight: 800; font-size: 20px; letter-spacing: -.03em; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--card); display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.icon-btn:active { transform: scale(.94); }
svg.ico, .icon-btn svg, .tabs svg, .ico svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.inline, .inline { width: 1em; height: 1em; vertical-align: -.14em; margin-right: .3em; }
.titles { margin: 14px 0 22px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.screen-title { font-size: 34px; font-weight: 800; line-height: 1.1; }
.screen-sub { margin: 6px 0 0; color: var(--muted); }

/* cards */
.card { background: var(--card); border-radius: var(--r); padding: 20px; margin-bottom: 14px; border: 1px solid var(--line); }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.card-head h3 { font-size: 17px; font-weight: 700; }
.sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.muted { color: var(--muted); } .dim { color: var(--dim); } .accent { color: var(--green); } .small { font-size: 13px; } .fine { color: var(--dim); font-size: 12px; margin: 10px 2px 18px; }
.lead { font-size: 17px; }
.pos { color: var(--green); } .neg { color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; } .spread { justify-content: space-between; } .grow { flex: 1; min-width: 0; } .wrap { flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 999px; border: 0; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; transition: transform .15s var(--ease), background .2s; -webkit-tap-highlight-color: transparent; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--green); color: #000; }
.btn.primary:hover { background: #77cc35; }
.btn.secondary { background: var(--card2); color: var(--text); border: 1px solid var(--line2); }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.danger { background: rgba(255,90,82,.12); color: var(--danger); }
.btn.sm { min-height: 44px; padding: 0 16px; font-size: 14px; }
.btn.block { width: 100%; }
.link { background: none; border: 0; color: var(--green); font-weight: 600; font-size: 14px; cursor: pointer; padding: 10px 0; min-height: 44px; }
.add-btn { width: 100%; min-height: 48px; border: 1px dashed var(--line2); background: none; border-radius: var(--r-sm); color: var(--muted); font-weight: 600; cursor: pointer; }
.del { width: 44px; height: 44px; border: 0; background: none; color: var(--dim); border-radius: 50%; cursor: pointer; display: grid; place-items: center; flex: none; }
.del:hover { color: var(--danger); }

/* home hero */
.hero { background: linear-gradient(160deg, #0d1a2b 0%, var(--card) 55%); padding: 22px; }
.hero-row { display: flex; align-items: center; gap: 20px; }
.ring { position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 10; }
.ring .track { stroke: rgba(255,255,255,.07); }
.ring .val { stroke: var(--green); stroke-linecap: round; transition: stroke-dashoffset .9s var(--ease); animation: ringIn 1.1s var(--ease) both; }
@keyframes ringIn { from { stroke-dashoffset: var(--c); } }
.ring-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-in b { font-size: 34px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.ring-in span { font-size: 12px; color: var(--muted); margin-top: 4px; }
.hero-side { min-width: 0; }
.hero-status { font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 4px; display: flex; align-items: center; gap: 6px; }
.hero-status.done { color: var(--green); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 20px 0 16px; }
.kpi { background: rgba(255,255,255,.04); border-radius: var(--r-sm); padding: 12px; display: flex; flex-direction: column; min-width: 0; }
.kpi b { font-size: 26px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
.k-l { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.k-s { font-size: 12px; color: var(--dim); }
.kpi .k-l svg { color: var(--green); }

/* next PR */
.pr-focus { display: flex; align-items: center; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.big { font-size: 44px; font-weight: 800; letter-spacing: -.04em; line-height: 1; color: var(--green); white-space: nowrap; }
.big svg { width: 40px; height: 40px; }
.pr-focus-t { font-weight: 700; font-size: 16px; }
.targets { list-style: none; margin: 0; padding: 0; }
.targets li { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); gap: 10px; }
.targets li:last-child { border-bottom: 0; padding-bottom: 0; }
.t-l { color: var(--muted); font-size: 14px; }
.t-v { text-align: right; display: flex; flex-direction: column; font-size: 13px; }
.t-v b { font-size: 17px; font-weight: 700; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stats.two { grid-template-columns: 1fr 1fr; }
.stat { display: flex; flex-direction: column; min-width: 0; }
.stat b { font-size: 28px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--muted); }
.ghost-line { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14px; font-weight: 600; }
.ghost-line svg { width: 18px; height: 18px; }

.alert { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--r-sm); margin-bottom: 14px; background: var(--card); border: 1px solid var(--line); }
.alert div { display: flex; flex-direction: column; } .alert span { font-size: 13px; color: var(--muted); }
.alert.warn { border-color: rgba(242,179,61,.35); } .alert.warn svg { color: var(--warn); }
.alert.danger, .alert.retire { border-color: rgba(255,90,82,.4); } .alert.danger svg, .alert.retire svg { color: var(--danger); }
.alert.ok svg { color: var(--green); }

/* recap */
.bars7, .bars8 { display: flex; align-items: flex-end; gap: 8px; height: 96px; margin: 18px 0 14px; }
.bars7 .b, .bars8 .b { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; }
.bars7 i, .bars8 i { display: block; width: 100%; max-width: 30px; border-radius: 6px; background: var(--navy2); transform-origin: bottom; animation: grow .7s var(--ease) both; }
.bars7 .b:not(.off) i { background: var(--green); }
.bars7 .off i { background: rgba(255,255,255,.08); }
.bars7 .today span, .bars8 .today span { color: var(--text); font-weight: 700; }
.bars7 span, .bars8 span { font-size: 11px; color: var(--dim); }
.bars8 { height: 130px; } .bars8 .today i { background: var(--green); }
.bars8 em { font-style: normal; font-size: 11px; color: var(--muted); }
@keyframes grow { from { transform: scaleY(0); } }
.trend-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.06); font-size: 13px; font-weight: 600; color: var(--muted); }
.chip.pos { background: var(--green-a); color: var(--green); }

.race { display: flex; gap: 18px; align-items: center; }
.race-days { display: flex; flex-direction: column; align-items: center; min-width: 76px; padding: 10px; border-radius: var(--r-sm); background: var(--navy); }
.race-days b { font-size: 34px; font-weight: 800; line-height: 1; } .race-days span { font-size: 11px; color: var(--muted); }

/* drinks */
.versus { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tapper { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 16px 8px; border-radius: var(--r-sm); border: 1px solid var(--line2); background: var(--card2); cursor: pointer; transition: transform .12s var(--ease); }
.tapper:active { transform: scale(.96); }
.tapper b { font-size: 34px; font-weight: 800; line-height: 1.1; } .tapper span { font-size: 13px; color: var(--muted); }
.tapper.water svg { color: var(--green); } .tapper.coke svg { color: var(--muted); }
.vsbar { display: flex; height: 6px; border-radius: 6px; overflow: hidden; gap: 3px; margin: 14px 0 6px; }
.vsbar i { display: block; transition: flex .4s var(--ease); } .vsbar .w { background: var(--green); } .vsbar .c { background: var(--wolf, #A5ACAF); opacity: .45; }
.minus-row { display: flex; justify-content: space-between; align-items: center; }
.minus-row button { background: none; border: 0; color: var(--dim); min-height: 44px; padding: 0 6px; cursor: pointer; font-size: 13px; }

/* quote */
.quote-card { padding: 28px 8px 8px; margin-top: 10px; text-align: center; border-top: 1px solid var(--line); }
.quote-card blockquote { margin: 14px 0 10px; font-size: 18px; line-height: 1.5; font-weight: 500; color: var(--text); }
.q-attr { color: var(--muted); font-size: 14px; } .q-attr span { display: block; color: var(--dim); font-size: 12px; }

/* weather */
.wx { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
.wx-temp { font-size: 46px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.wx-best { text-align: right; } .wx-best b { color: var(--green); font-size: 17px; }
.tips { margin: 14px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; } .tips li { margin: 4px 0; }
.tips li::marker { color: var(--green); }

/* forms */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
input, select, textarea { width: 100%; min-height: 48px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--line2); background: var(--bg1); color: var(--text); font-size: 16px; outline: none; transition: border-color .2s, box-shadow .2s; min-width: 0; }
input:focus, select:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-a); }
input::placeholder { color: var(--dim); }
input[type=date] { -webkit-appearance: none; appearance: none; }
form.row input { width: auto; } form.row input.grow { flex: 1 1 0; } form.row .btn { flex: none; }
.seg, .seg-in { display: flex; gap: 6px; background: var(--card); padding: 4px; border-radius: 999px; border: 1px solid var(--line); overflow-x: auto; margin-bottom: 14px; scrollbar-width: none; }
.seg-in { background: var(--bg1); margin: 0; }
.seg button, .seg-in label { flex: 1; min-height: 40px; border: 0; background: none; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 13px; white-space: nowrap; padding: 0 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.seg button[aria-pressed=true], .seg-in input:checked + span { color: #000; }
.seg button[aria-pressed=true] { background: var(--green); }
.seg-in label { position: relative; padding: 0; }
.seg-in input { position: absolute; opacity: 0; inset: 0; min-height: 0; cursor: pointer; }
.seg-in span { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 999px; padding: 0 6px; transition: background .2s; }
.seg-in input:checked + span { background: var(--green); }
.seg-in input:focus-visible + span { box-shadow: 0 0 0 2px var(--green); }

/* ghost */
.ghost { border-radius: var(--r-sm); padding: 14px; margin-bottom: 14px; background: var(--bg1); border: 1px solid var(--line); transition: border-color .3s; }
.ghost.ahead { border-color: rgba(105,190,40,.5); } .ghost.behind { border-color: var(--line2); }
.gh-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: var(--muted); }
.gh-head svg { width: 18px; height: 18px; }
.gh-result { font-size: 24px; font-weight: 800; margin-top: 6px; letter-spacing: -.02em; }
.ghost.ahead .gh-result { color: var(--green); }

/* lists */
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; }
.name { flex: 1; min-width: 0; font-weight: 600; }
.s { display: block; font-size: 12px; color: var(--muted); font-weight: 400; overflow: hidden; text-overflow: ellipsis; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.08); color: var(--muted); vertical-align: 2px; }
.tag.accent { background: var(--green-a); color: var(--green); }
.shoe { padding: 14px 0; border-bottom: 1px solid var(--line); } .shoe:last-of-type { border-bottom: 0; }
.st { font-size: 12px; font-weight: 600; } .st.ok { color: var(--green); } .st.warn { color: var(--warn); } .st.danger, .st.retire { color: var(--danger); }
.bar { position: relative; height: 8px; background: rgba(255,255,255,.07); border-radius: 8px; margin: 8px 0; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 8px; transition: width .8s var(--ease); animation: fill .9s var(--ease) both; transform-origin: left; }
.bar.warn i { background: var(--warn); } .bar.danger i, .bar.retire i { background: var(--danger); }
.bar .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(0,0,0,.6); }
@keyframes fill { from { transform: scaleX(0); } }

/* routes */
.route-head { display: flex; align-items: flex-start; gap: 10px; }
.route-head h3 { font-size: 19px; font-weight: 800; }
.icon-btn.sm { width: 44px; height: 44px; background: var(--card2); }
.icon-btn.sm svg { width: 18px; height: 18px; }
.route-notes { margin: 8px 0 0; }
.route-best { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin: 16px 0; padding: 14px; border-radius: var(--r-sm); background: linear-gradient(150deg, #0d1a2b, var(--bg1) 80%); }
.rb-v { font-size: 36px; font-weight: 800; letter-spacing: -.04em; line-height: 1.1; color: var(--green); }
.spark { display: flex; align-items: flex-end; gap: 4px; height: 52px; width: 112px; flex: none; }
.spark i { flex: 1; background: var(--navy2); border-radius: 3px; animation: grow .6s var(--ease) both; transform-origin: bottom; }
.spark i.last { background: var(--muted); } .spark i.best { background: var(--green); }
.stats.r4 b { font-size: 22px; }
.route-runs { margin-top: 14px; border-top: 1px solid var(--line); }
.route-runs summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; color: var(--green); font-weight: 600; font-size: 14px; list-style: none; }
.route-runs summary::-webkit-details-marker { display: none; }
.route-runs li { gap: 10px; font-size: 14px; }
.new-route { margin: -4px 0 4px; padding: 12px 12px 0; border-radius: var(--r-sm); background: var(--bg1); border: 1px dashed var(--line2); }
.new-route[hidden] { display: none; }

/* charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--dim); font-size: 10px; font-family: var(--font); }
.chart line { stroke: rgba(255,255,255,.06); }
.draw { stroke-dasharray: 2000; stroke-dashoffset: 2000; animation: draw 1.4s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* progress */
.ba { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pane { text-align: center; }
.photo { aspect-ratio: 3/4; border-radius: var(--r-sm); background: var(--bg1); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; margin-top: 8px; color: var(--dim); }
.photo img { width: 100%; height: 100%; object-fit: cover; }
.photo svg { width: 32px; height: 32px; }
.w { font-size: 26px; font-weight: 800; letter-spacing: -.03em; margin-top: 8px; }
.ms-row { margin-top: 16px; }
.moodbars { display: flex; gap: 8px; align-items: flex-end; height: 140px; margin: 14px 0 6px; }
.mb { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; }
.mb .col { flex: 1; width: 100%; display: flex; align-items: flex-end; }
.mb .col i { display: block; width: 100%; background: var(--green); border-radius: 6px 6px 3px 3px; animation: grow .7s var(--ease) both; transform-origin: bottom; }
.mb .v { font-size: 11px; color: var(--muted); } .mb .e, .mb .n { font-size: 11px; color: var(--dim); text-align: center; }

/* records */
.pr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pr { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.pr:first-child { grid-column: 1 / -1; background: linear-gradient(150deg, #0d1a2b, var(--card) 70%); }
.pr-v { font-size: 34px; font-weight: 800; letter-spacing: -.04em; line-height: 1.15; margin: 6px 0 2px; color: var(--text); }
.pr:first-child .pr-v { font-size: 46px; color: var(--green); }
.pr-v small { font-size: .45em; font-weight: 600; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
.pr.empty .pr-v { color: var(--dim); }
.wide { grid-column: 1 / -1; }
.est { display: inline-block; margin-top: 6px; font-size: 11px; color: var(--muted); background: rgba(255,255,255,.06); padding: 2px 8px; border-radius: 999px; }
.tbl { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 600; padding: 6px 4px; }
.tbl td { padding: 10px 4px; border-top: 1px solid var(--line); }
.tbl .best td { color: var(--green); font-weight: 700; }
.efforts { list-style: none; padding: 0; margin: 8px 0 0; }
.efforts li { display: flex; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.efforts li:last-child { border-bottom: 0; }
.efforts b { min-width: 76px; font-weight: 700; } .efforts .muted { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rk { width: 22px; color: var(--dim); font-weight: 700; font-size: 13px; }
.efforts li:first-child .rk { color: var(--green); }
.ach-group { padding: 12px 0; border-bottom: 1px solid var(--line); } .ach-group:last-child { border-bottom: 0; }
.ach-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.ach { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line2); color: var(--dim); }
.ach.earned { border-color: transparent; background: var(--green-a); color: var(--green); }

/* overlay + sheets */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.66); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: none; align-items: flex-end; justify-content: center; }
.overlay.show { display: flex; animation: fade .2s ease both; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: #0e1012; border: 1px solid var(--line); border-bottom: 0; border-radius: 28px 28px 0 0; padding: 26px 20px calc(20px + env(safe-area-inset-bottom)); animation: up .35s var(--ease) both; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet h2 { font-size: 24px; font-weight: 800; margin: 4px 0 16px; }
.sheet-actions { display: grid; gap: 8px; margin-top: 18px; }
.celebrate { text-align: center; }
.celebrate h2 { font-size: 28px; margin-top: 6px; }
.cel-sub { color: var(--muted); margin: -8px 0 12px; }
.cel-list { list-style: none; padding: 0; margin: 14px 0 0; text-align: left; }
.cel-list li { display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: var(--card); border-radius: var(--r-sm); margin-bottom: 8px; animation: rise .4s var(--ease) both; }
.cel-list li:nth-child(2) { animation-delay: .08s; } .cel-list li:nth-child(3) { animation-delay: .16s; }
.cel-list li > svg { color: var(--green); flex: none; }
.cel-list b { display: block; } .cel-list span { font-size: 13px; color: var(--green); }
.burst { position: relative; width: 84px; height: 84px; margin: 4px auto 14px; }
.burst svg { position: relative; width: 100%; height: 100%; }
.burst .c { fill: var(--green-a); stroke: var(--green); stroke-width: 2.5; stroke-dasharray: 151; stroke-dashoffset: 151; animation: dash .7s var(--ease) .1s forwards; }
.burst .k { fill: none; stroke: var(--green); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: dash .45s var(--ease) .6s forwards; }
@keyframes dash { to { stroke-dashoffset: 0; } }
.halo { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--green); opacity: 0; animation: halo 1.6s var(--ease) .5s 2; }
.halo.h2 { animation-delay: .9s; }

    toast('Added ' + plural(m.added.length, 'run') + (m.skipped ? ' · skipped ' + m.skipped + ' duplicate' + (m.skipped === 1 ? '' : 's') : '') + (m.invalid ? ' · ' + m.invalid + ' unreadable' : ''));
    return m;
  }

  // ---------- settings / race ----------
  function settings() {
    var p = state.profile;
    overlay('<div class="sheet" role="dialog" aria-label="Settings"><h2>Settings</h2><form id="settings-form">' +
      '<div class="grid2"><div class="field"><label>Name</label><input name="name" value="' + esc(p.name || firstName()) + '" placeholder="First name"></div><div class="field"><label>Daily goal (mi)</label><input name="dailyGoal" type="number" step="0.1" min="0.1" value="' + esc(p.dailyGoal) + '"></div>' +
      '<div class="field"><label>Weekly goal (mi)</label><input name="weeklyGoal" type="number" step="0.5" min="1" value="' + esc(p.weeklyGoal) + '"></div><div class="field"><label>Water goal (oz/day)</label><input name="waterOz" type="number" inputmode="decimal" min="8" max="300" value="' + esc(p.waterOz || 64) + '"></div>' +
      '</div><div class="eyebrow" style="margin:8px 0 10px">Body metrics</div><section class="body-metrics" data-testid="body-metrics"><div class="grid2">' +
      '<div class="field"><label for="bm-lbs">Current weight (lbs)</label><input id="bm-lbs" name="bodyLbs" type="number" inputmode="decimal" step="0.1" min="50" max="700" value="' + esc(p.bodyLbs || '') + '" placeholder="e.g. 246"></div>' +
      '<div class="field"><label for="bm-ft">Height</label><div class="hfield"><input id="bm-ft" name="heightFt" type="number" inputmode="numeric" pattern="[0-9]*" min="3" max="8" value="' + (p.heightIn ? Math.floor(p.heightIn / 12) : '') + '" placeholder="ft" aria-label="Feet"><span>ft</span><input id="bm-in" name="heightInch" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="11" value="' + (p.heightIn ? p.heightIn % 12 : '') + '" placeholder="in" aria-label="Inches"><span>in</span></div></div></div>' +
      '<p class="fine" style="margin-top:0">Used only to estimate calories burned per run' + (p.bodyLbs && p.heightIn ? ' · BMI ' + (703 * p.bodyLbs / (p.heightIn * p.heightIn)).toFixed(1) : '') + '.</p></section>' +
      '<button class="btn primary block">Save</button></form>' +
      '<div class="eyebrow" style="margin:22px 0 10px">Your data</div><div class="row wrap"><button class="btn secondary sm" data-action="export">Export</button><label class="btn secondary sm">Import<input type="file" accept="application/json,.json" class="sr" id="import-file"></label><label class="btn secondary sm">Merge runs from file<input type="file" accept="application/json,.json" class="sr" id="merge-file"></label>' + (nrcPending().length ? '<button class="btn secondary sm" data-action="nrc-import">Import Nike Run Club history</button>' : '') + '<button class="btn secondary sm" data-action="demo">Load demo</button><button class="btn danger sm" data-action="reset">Erase all</button></div>' +
      '<p class="fine">Import replaces everything with a backup. Merge only adds runs that aren’t already logged (same date, distance within 0.05 mi). Everything is saved in this browser on this device.</p><div class="sheet-actions"><button class="btn ghost block" data-action="close-overlay">Close</button></div></div>');
  }
  function raceForm() {
    var r = state.race || {};
    overlay('<div class="sheet" role="dialog" aria-label="Race goal"><h2>Race goal</h2><form id="race-form">' +
      '<div class="field"><label for="race-name">Race name</label><input id="race-name" name="name" value="' + esc(r.name || '') + '" placeholder="Turkey Trot" required></div>' +
      '<div class="grid2"><div class="field"><label for="race-dist">Distance</label><select id="race-dist" name="distance">' + Object.keys(F.RACE_DISTANCES).map(function (k) { return '<option' + (r.distance === k ? ' selected' : '') + '>' + k + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="race-date">Date</label><input id="race-date" name="date" type="date" min="' + today() + '" value="' + esc(r.date || '') + '" required></div></div>' +
      timeField('target', 'Goal time (optional)', F.parseDuration(r.targetTime), false) +
      '<button class="btn primary block">Save race</button></form><div class="sheet-actions"><button class="btn ghost block" data-action="close-overlay">Cancel</button></div></div>');
  }

  function editRun(id) {
    var r = state.runs.filter(function (x) { return x.id === id; })[0]; if (!r) return;
    overlay('<div class="sheet" role="dialog" aria-label="Edit run"><h2>Edit run</h2><form id="edit-form" data-id="' + r.id + '"><div class="grid2">' +
      '<div class="field"><label for="edit-miles">Distance (mi)</label><input id="edit-miles" name="miles" type="number" inputmode="decimal" step="0.01" min="0.1" max="100" value="' + r.miles + '" required></div>' +
      '<div class="field"><label for="edit-date">Date</label><input id="edit-date" name="date" type="date" max="' + today() + '" value="' + r.date + '" required></div></div>' +
      timeField('etime', 'Time', r.minutes, true) +
      routePicker('edit', r.routeId) + raceFields('edit', r) +
      '<button class="btn primary block">Save changes</button></form><div class="sheet-actions"><button class="btn ghost block" data-action="close-overlay">Cancel</button></div></div>');
  }

  // ---------- demo data ----------
  function demo() {
    var t = today(), s = blank(), rnd = 7;
    function rand() { rnd = (rnd * 9301 + 49297) % 233280; return rnd / 233280; }
    s.profile = { name: 'Jon', initials: 'JON', bodyLbs: 228, heightIn: 72, dailyGoal: 4, weeklyGoal: 25, waterOz: 64 };
    s.shoes = [{ id: 'sh1', name: 'Brooks Ghost 15', startMiles: 120, retired: true }, { id: 'sh2', name: 'Nike Pegasus 41', startMiles: 150 }];
    s.activeShoe = 'sh2';
    for (var i = 120; i >= 0; i--) {
      var d = F.addDays(t, -i), dow = F.parseISO(d).getDay();
      var run = (dow !== 1 && rand() > 0.32) || (i <= 8 && i >= 1);
      if (run && i !== 0) {
        var miles = F.round1(2 + rand() * 3 + (dow === 6 ? 3 : 0) + (120 - i) / 60);
        var pace = 11.4 - (120 - i) / 60 + rand() * 0.9, rt = null;
        if (dow === 3) { rt = 'Stones River Greenway'; miles = 4.2; }
        if (dow === 5) { rt = 'Barfield Crescent loop'; miles = 3.1; }
        var mood = Math.max(1, Math.min(5, Math.round(3 + (rand() - 0.5) * 3 + (pace < 10.5 ? 0.8 : -0.4)))), energy = Math.max(1, Math.min(5, Math.round(mood + (rand() - 0.5) * 2)));
        var notes = ['Legs felt fresh', 'Humid, took it easy', 'Slept badly', 'Negative split', 'Windy on the back half', 'Easy recovery run'];
        s.runs.push({ id: 'r' + i, date: d, miles: miles, minutes: F.round1(miles * (pace + (3 - energy) * 0.15)), cadence: Math.round(158 + (120 - i) / 24 + rand() * 4), hr: Math.round(152 - (120 - i) / 20 + rand() * 8), shoeId: i > 70 ? 'sh1' : 'sh2',
          route: rt, mood: i < 60 ? mood : null, energy: i < 60 ? energy : null, note: i < 60 && rand() > 0.6 ? notes[Math.floor(rand() * notes.length)] : null });
      }
    }
    s.water[t] = [{ id: 'd1', oz: 16.9, t: '07:10' }, { id: 'd2', oz: 8, t: '09:45' }, { id: 'd3', oz: 20, t: '12:20' }];
    s.routes = F.migrateRoutes([], s.runs, uid).routes;
    s.routes.forEach(function (r) { if (/Greenway/.test(r.name)) { r.surface = 'Paved'; r.location = 'Murfreesboro, TN'; r.notes = 'Start at Thompson Lane trailhead. Flat and shaded.'; } else { r.surface = 'Mixed'; r.location = 'Barfield Crescent Park'; } });
    s.routes.push({ id: uid(), name: 'Old Fort trail', miles: 5, surface: 'Trail', location: 'Old Fort Park', notes: 'Rooty in the woods section' });
    s.race = { name: 'Turkey Trot', distance: '10K', date: F.addDays(t, 46), targetTime: '58:00' };
    s.flags = { nrcImported: true, racesTagged: true, framily: true }; s.celebrated = { milestone: 0, badges: [], ach: F.achievements(s.profile, s.weights, s.runs).earned.map(function (a) { return a.id; }) };
    if (state && state.weather) s.weather = state.weather;
    return s;
  }

  // ---------- main render ----------
  var SCREENS = { home: renderHome, run: renderRun, scores: renderScores, routes: renderRoutes };
  function render() {
    var tab = state.ui.tab in SCREENS ? state.ui.tab : 'home';
    $('#main').innerHTML = header() + '<div class="screen" data-screen="' + tab + '">' + SCREENS[tab]() + '</div>';
    document.querySelectorAll('nav.tabs button').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.goto === tab); });
    if (tab === 'home') fetchWeather();
  }
  function go(tab) { state.ui.tab = tab; save(); render(); window.scrollTo(0, 0); }
  function importData(txt) {
    var s; try { s = JSON.parse(txt); } catch (x) { s = null; }
    if (!s || s.v !== 1 || !Array.isArray(s.runs)) { toast('That file isn’t a Grit backup'); return; }
    if (!confirm('Are you sure? This replaces your current data with the backup (' + plural(s.runs.length, 'run') + ').')) { toast('Import cancelled — your data is unchanged'); return; }
    state = migrate(Object.assign(blank(), s)); save(); closeOverlay(); render(); toast('Backup imported');
  }

  document.addEventListener('click', function (e) {
    var g = e.target.closest('[data-goto]'); if (g) { closeOverlay(); go(g.dataset.goto); return; }
    var a = e.target.closest('[data-action]'); if (!a) { if (e.target.id === 'overlay') closeOverlay(); return; }
    var act = a.dataset.action, id = a.dataset.id, t = today();
    switch (act) {
      case 'nrc-import': if (mergeIn(NRC_RUNS, 'Nike Run Club', 'Nike Run Club (' + nrcRange() + ')')) { state.flags.nrcImported = true; save(); render(); } break;
      case 'nrc-dismiss': state.flags.nrcHidden = NRC_RUNS.length; save(); render(); toast('Hidden. You can still import from Settings.'); break;
      case 'water-add': addWater(parseFloat(a.dataset.oz)); break;
      case 'water-del': state.water[t] = (state.water[t] || []).filter(function (x) { return x.id !== id; }); save(); refreshWater(); break;
      case 'water-undo': var wl = state.water[t] || []; if (wl.length) { var gone = wl.pop(); save(); refreshWater(); toast('Removed ' + fmtOz(gone.oz) + ' oz'); } break;
      case 'edit-run': editRun(id); break;
      case 'del-run': state.runs = state.runs.filter(function (r) { return r.id !== id; }); save(); render(); break;
      case 'miles-view': state.ui.milesView = id; save(); render(); break;
      case 'shoe-active': state.activeShoe = id; save(); render(); break;
      case 'shoe-retire': state.shoes.forEach(function (s) { if (s.id === id) s.retired = true; }); if (state.activeShoe === id) { var nx = state.shoes.filter(function (s) { return !s.retired; })[0]; state.activeShoe = nx ? nx.id : null; } save(); render(); break;
      case 'shoe-unretire': state.shoes.forEach(function (s) { if (s.id === id) s.retired = false; }); save(); render(); break;
      case 'settings': settings(); break;
      case 'race-form': raceForm(); break;
      case 'past-race': pastRaceForm(); break;
      case 'race-clear': state.race = null; save(); render(); break;
      case 'close-overlay': closeOverlay(); break;
      case 'wx-loc': locModal(); break;
      case 'wx-refresh': fetchWeather(true); render(); break;
      case 'wx-reset': state.weather.loc = { name: 'Murfreesboro, TN', lat: 35.8456, lon: -86.3903 }; save(); closeOverlay(); render(); break;
      case 'geo-pick': state.weather.loc = { name: a.dataset.name, lat: +a.dataset.lat, lon: +a.dataset.lon }; save(); closeOverlay(); render(); break;
      case 'route-new': routeForm(null); break;
      case 'route-edit': routeForm(id); break;
      case 'route-del':
        var dr0 = routeById(id); if (!dr0) break;
        if (confirm('Delete the route "' + dr0.name + '"? Your runs on it are kept, just without a route.')) {
          state.runs.forEach(function (r) { if (r.routeId === id) { r.routeId = null; r.route = null; } });
          state.routes = state.routes.filter(function (r) { return r.id !== id; }); save(); closeOverlay(); render(); toast('Route deleted');
        } break;
      case 'demo': if (confirm('Replace your data with demo data?')) { state = demo(); save(); closeOverlay(); render(); } break;
      case 'reset': if (confirm('Erase ALL data on this device?')) { state = blank(); save(); closeOverlay(); render(); } break;
      case 'export':
        var blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' }), u = URL.createObjectURL(blob), l = document.createElement('a');
        l.href = u; l.download = 'grit-backup-' + t + '.json'; l.click(); setTimeout(function () { URL.revokeObjectURL(u); }, 1000); break;
    }
  });
  document.addEventListener('input', function (e) {
    var tf = e.target.closest && e.target.closest('.tfield');
    if (tf) {
      var el = e.target, d = el.value.replace(/\D/g, '');
      if (d !== el.value) el.value = d;
      if (el.classList.contains('t-s') && d.length && +d > 59) el.value = d.length > 2 ? d.slice(0, 2) > '59' ? '59' : d.slice(0, 2) : '59';
      if (el.classList.contains('t-m') && d.length >= 2) { var nx = tf.querySelector('.t-s'); if (nx && document.activeElement === el) { nx.focus(); nx.select(); } }
      if (el.classList.contains('t-h') && d.length >= 2) tf.querySelector('.t-m').focus();
    } if (e.target.closest && e.target.closest('#run-form')) updateGhostPreview(); });
  document.addEventListener('change', function (e) {
    var rp = e.target.dataset && e.target.dataset.routePick;
    if (rp) {
      var fm = e.target.form, box = document.getElementById(rp + '-newroute'), opt = e.target.selectedOptions[0], mEl = fm.querySelector('[name=miles]');
      box.hidden = e.target.value !== '__new'; if (!box.hidden) fm.querySelector('[name=nrName]').focus();
      if (opt && opt.dataset.miles && mEl && (!mEl.value || mEl.dataset.prefilled === '1')) { mEl.value = opt.dataset.miles; mEl.dataset.prefilled = '1'; }
      if (fm.id === 'run-form') updateGhostPreview(); return;
    }
    if (e.target.name === 'miles') e.target.dataset.prefilled = '';
    if (e.target.dataset && e.target.dataset.action === 'ghost-route') { state.ui.ghostRoute = e.target.value; save(); render(); return; }
    if (e.target.id === 'merge-file' && e.target.files[0]) { e.target.files[0].text().then(function (txt) {
      var d; try { d = JSON.parse(txt); } catch (x) { d = null; }
      var list = Array.isArray(d) ? d : d && Array.isArray(d.runs) ? d.runs : null;
      if (!list) { toast('No runs found in that file'); return; }
      mergeIn(list, null, 'this file');
    }); return; }
    if (e.target.id === 'import-file' && e.target.files[0]) { var f = e.target.files[0]; f.text().then(importData); }
  });
  document.addEventListener('submit', function (e) {
    e.preventDefault(); var f = e.target, fd = new FormData(f);
    if (f.id === 'run-form') {
      var mi = parseFloat(fd.get('miles')), min = readTime(f, 'time');
      if (!(mi > 0) || !(min > 0)) { toast('Enter a distance and a time (minutes and seconds)'); return; }
      var rt = resolveRoute(fd, mi); if (rt === false) return;
      var cad = parseInt(fd.get('cadence'), 10), hr = parseInt(fd.get('hr'), 10), route = rt ? rt.name : '';
      var newRun = { id: uid(), date: fd.get('date'), miles: Math.round(mi * 100) / 100, minutes: min, cadence: cad > 0 ? cad : null, hr: hr > 0 ? hr : null, shoeId: fd.get('shoe') || null,
        route: route || null, routeId: rt ? rt.id : null, mood: +fd.get('mood') || null, energy: +fd.get('energy') || null, note: (fd.get('note') || '').trim() || null, race: readRace(fd) };
      var hadRuns = state.runs.length > 0, prsBefore = F.personalRecords(state.runs);
      var gc = F.ghostCompare(state.runs, { route: route, miles: newRun.miles, minutes: min, beforeDate: newRun.date });
      state.runs.push(newRun);
      var recs = F.newRecords(prsBefore, F.personalRecords(state.runs));
      save(); render(); toast(hadRuns ? 'Run saved · ' + newRun.miles + ' mi at ' + F.fmtPace(min / mi) + '/mi' : 'First run saved. That’s your baseline — now beat it.');
      afterRun({ recs: recs, hadRuns: hadRuns, ghost: gc });
    }
    if (f.id === 'edit-form') {
      var er = state.runs.filter(function (x) { return x.id === f.dataset.id; })[0], emi = parseFloat(fd.get('miles')), emin = readTime(f, 'etime');
      if (!er) return; if (!(emi > 0) || !(emin > 0)) { toast('Enter a distance and a time (seconds 0–59)'); return; }
      var ert = resolveRoute(fd, emi); if (ert === false) return;
      er.miles = Math.round(emi * 100) / 100; er.minutes = emin; er.date = fd.get('date') || er.date; er.route = ert ? ert.name : null; er.routeId = ert ? ert.id : null; er.race = readRace(fd);
      save(); closeOverlay(); render(); toast('Run updated'); return;
    }
    if (f.id === 'past-race-form') {
      var pmi = parseFloat(fd.get('miles')), pmin = readTime(f, 'ptime'), pd = fd.get('date');
      if (!(pmi > 0) || !(pmin > 0) || !pd) { toast('Enter date, distance and finish time'); return; }
      var prace = readRace(fd) || { name: 'Race' };
      state.runs.push({ id: uid(), date: pd, miles: Math.round(pmi * 100) / 100, minutes: pmin, cadence: null, hr: null, shoeId: null, route: null, routeId: null, mood: null, energy: null, note: null, race: prace });
      state.celebrated.ach = ach().earned.map(function (a) { return a.id; });
      save(); closeOverlay(); render(); toast('Race result added · ' + prace.name); return;
    }
    if (f.id === 'water-form') { var cz = parseFloat(fd.get('oz')); if (cz > 0) { addWater(cz); } else toast('Enter ounces'); return; }
    if (f.id === 'route-form') {
      var rid = f.dataset.id, nm = (fd.get('name') || '').trim().replace(/\s+/g, ' '), dup = routeByName(nm), rmi = parseFloat(fd.get('miles'));
      if (!nm) return; if (dup && dup.id !== rid) { toast('You already have a route called ' + dup.name); return; }
      var ro = rid ? routeById(rid) : { id: uid() };
      ro.name = nm; ro.miles = rmi > 0 ? Math.round(rmi * 100) / 100 : null; ro.surface = fd.get('surface') || ''; ro.location = (fd.get('location') || '').trim(); ro.notes = (fd.get('notes') || '').trim();
      if (rid) state.runs.forEach(function (r) { if (r.routeId === rid) r.route = nm; }); else state.routes.push(ro);
      save(); closeOverlay(); render(); toast(rid ? 'Route saved' : 'Route added'); return;
    }
    if (f.id === 'shoe-form') {
      var sh = { id: uid(), name: fd.get('name').trim(), startMiles: parseFloat(fd.get('start')) || 0 };
      state.shoes.push(sh); if (!activeShoe()) state.activeShoe = sh.id; save(); render();
    }
    if (f.id === 'race-form') {
      var tm = readTime(f, 'target'), anyT = ['h', 'm', 's'].some(function (p) { return (fd.get('target-' + p) || '').trim(); });
      if (anyT && !(tm > 0)) { toast('Check the goal time (seconds 0–59)'); return; }
      var tt = tm > 0 ? F.fmtDuration(tm) : '';
      state.race = { name: fd.get('name').trim(), distance: fd.get('distance'), date: fd.get('date'), targetTime: tt }; save(); closeOverlay(); render();
    }
    if (f.id === 'geo-form') {
      var q = $('#geo-q').value.trim(); if (!q) return; $('#geo-results').innerHTML = '<li class="muted">Searching…</li>';
      fetch(F.geocodeUrl(q)).then(function (r) { return r.json(); }).then(function (dd) {
        var res = dd.results || [];
        $('#geo-results').innerHTML = res.length ? res.map(function (g) { var nm = g.name + (g.admin1 ? ', ' + g.admin1 : '') + (g.country_code && g.country_code !== 'US' ? ', ' + g.country_code : '');
          return '<li><div class="name">' + esc(nm) + '<span class="s">' + g.latitude.toFixed(3) + ', ' + g.longitude.toFixed(3) + '</span></div><button class="btn secondary sm" data-action="geo-pick" data-name="' + esc(nm) + '" data-lat="' + g.latitude + '" data-lon="' + g.longitude + '">Use</button></li>'; }).join('') : '<li class="muted">No matches.</li>';
      }).catch(function () { $('#geo-results').innerHTML = '<li class="muted">Search failed — enter latitude/longitude manually.</li>'; });
      return;
    }
    if (f.id === 'loc-form') {
      var la = parseFloat(fd.get('lat')), lo = parseFloat(fd.get('lon'));
      if (!(la >= -90 && la <= 90 && lo >= -180 && lo <= 180)) { toast('Latitude/longitude out of range'); return; }
      state.weather.loc = { name: (fd.get('name') || '').trim() || (la.toFixed(2) + ', ' + lo.toFixed(2)), lat: la, lon: lo }; save(); closeOverlay(); render(); return;
    }
    if (f.id === 'settings-form') {
      var p = state.profile;
      p.name = (fd.get('name') || '').trim(); p.dailyGoal = parseFloat(fd.get('dailyGoal')) || 3; p.weeklyGoal = parseFloat(fd.get('weeklyGoal')) || 15;
      var bl = parseFloat(fd.get('bodyLbs')), hf = parseInt(fd.get('heightFt'), 10), hi = parseInt(fd.get('heightInch'), 10) || 0;
      p.bodyLbs = bl > 0 ? Math.round(bl * 10) / 10 : null; p.heightIn = hf > 0 ? hf * 12 + Math.min(11, Math.max(0, hi)) : null;
      p.waterOz = Math.round(parseFloat(fd.get('waterOz')) * 10) / 10 || 64;
      save(); closeOverlay(); render(); toast('Settings saved');
    }
  });

  if (params.get('demo') === '1' && !localStorage.getItem(KEY)) { state = demo(); save(); }
  if (params.get('tab') && TABS.indexOf(params.get('tab')) !== -1) state.ui.tab = params.get('tab');
  window.Grit = { demo: demo, getState: function () { return state; }, setState: function (s) { state = migrate(s); save(); render(); }, render: render };
  render();
})();

</script>

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function (e) { console.warn('SW registration failed', e); }); });
}
</script>
